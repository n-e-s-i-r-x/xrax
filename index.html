<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>0v Ai</title>
    <link rel="icon" href="icon.webp" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
      @font-face { font-family:"M"; src:url("M.ttf") format("truetype"); }
      *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
      html,body { height:100%; overflow:hidden; }
      body { font-family:"M",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#000; color:#fff; -webkit-font-smoothing:antialiased; font-size:16px; overscroll-behavior:none; }
      button,input,textarea { font-family:"M"; font-size:16px; color:inherit; }
      button { cursor:pointer; border:none; background:none; }
      input,textarea { outline:none; border:none; background:none; }
      ::-webkit-scrollbar { width:0; height:0; }

      #intro { position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center; transition:opacity 1s ease; }
      #intro.hide { opacity:0; pointer-events:none; }
      #intro-logo { width:72px; height:72px; object-fit:contain; animation:introPop 3s cubic-bezier(0.34,1.56,0.64,1) forwards; background:none!important; border:none!important; box-shadow:none!important; border-radius:0!important; }
      @keyframes introPop { 0%{opacity:0;transform:scale(0.6)} 100%{opacity:1;transform:scale(1)} }
      #intro-pulse { position:absolute; width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,0.05); animation:iPulse 1.5s ease-out infinite; }
      @keyframes iPulse { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.5);opacity:0} }

      #app { position:fixed; inset:0; display:flex; flex-direction:column; background:#000; opacity:0; transition:opacity 0.4s ease; }
      #app.ready { opacity:1; }

      #topbar { flex-shrink:0; display:flex; align-items:center; padding:0 12px; gap:10px; background:#000; border-bottom:1px solid #141414; padding-top:env(safe-area-inset-top); height:calc(56px + env(safe-area-inset-top)); }
      .tb-btn { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#888; flex-shrink:0; transition:background .15s,color .15s,transform .1s; }
      .tb-btn:active { background:#141414; color:#fff; transform:scale(.92); }
      .tb-center { flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; }
      .tb-title { font-size:15px; font-weight:600; color:#ddd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

      #chat-wrap { flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column; }
      #chat-area { flex:1; overflow-y:auto; padding:16px 0 8px; -webkit-overflow-scrolling:touch; }

      #empty-state { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; gap:14px; animation:fadeUp .5s ease; }
      @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
      #empty-logo { width:60px; height:60px; object-fit:contain; opacity:.5; background:none!important; border:none!important; box-shadow:none!important; border-radius:0!important; }
      #empty-h { font-size:22px; font-weight:700; color:#ddd; text-align:center; }
      #empty-s { font-size:14px; color:#555; text-align:center; max-width:300px; line-height:1.5; }

      .msg-row { padding:4px 0; animation:msgIn .3s ease; }
      @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      .msg-in { padding:0 14px; }
      .msg-row.user .msg-in { display:flex; flex-direction:column; align-items:flex-end; }
      .u-bubble { background:#1a1a1a; border-radius:18px 18px 4px 18px; padding:10px 14px; max-width:85%; font-size:15px; line-height:1.5; color:#fff; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word; }
      .msg-row.ai .msg-content { display:flex; gap:10px; align-items:flex-start; }
      .ai-av { width:28px; height:28px; object-fit:contain; flex-shrink:0; background:none!important; border:none!important; box-shadow:none!important; border-radius:0!important; padding:0!important; }
      .ai-body { flex:1; min-width:0; }
      .ai-txt { font-size:15px; line-height:1.6; color:#ddd; word-wrap:break-word; overflow-wrap:break-word; }
      .ai-txt h1,.ai-txt h2,.ai-txt h3 { color:#fff; margin:12px 0 6px; font-weight:600; }
      .ai-txt h1{font-size:20px} .ai-txt h2{font-size:17px} .ai-txt h3{font-size:15px}
      .ai-txt p{margin:0 0 8px} .ai-txt p:last-child{margin:0}
      .ai-txt ul,.ai-txt ol{margin:6px 0 8px 20px} .ai-txt li{margin:3px 0}
      .ai-txt strong{color:#fff;font-weight:600} .ai-txt a{color:#4a9eff;text-decoration:underline}
      .ai-txt blockquote{border-left:3px solid #2a2a2a;padding:4px 12px;color:#888;margin:8px 0}
      .ai-txt code:not(pre code){background:#1a1a1a;border-radius:4px;padding:2px 6px;font-family:"M",Menlo,monospace;font-size:13px;color:#ddd}

      /* activity */
      .activity-wrap{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
      .activity-orb{width:28px;height:28px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
      .activity-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;animation:orbSpin 1.8s linear infinite}
      .activity-orb-dot{width:6px;height:6px;border-radius:50%;position:relative;z-index:1}
      .activity-wrap[data-state="thinking"] .activity-orb-ring{border-top-color:#a855f7;border-right-color:rgba(168,85,247,.3)}
      .activity-wrap[data-state="thinking"] .activity-orb-dot{background:#a855f7;box-shadow:0 0 8px rgba(168,85,247,.6)}
      .activity-wrap[data-state="writing"]  .activity-orb-ring{border-top-color:#ddd;border-right-color:rgba(221,221,221,.3)}
      .activity-wrap[data-state="writing"]  .activity-orb-dot{background:#999}
      .activity-wrap[data-state="coding"]   .activity-orb-ring{border-top-color:#4ade80;border-right-color:rgba(74,222,128,.3)}
      .activity-wrap[data-state="coding"]   .activity-orb-dot{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.5)}
      .activity-wrap[data-state="searching"] .activity-orb-ring{border-top-color:#4a9eff;border-right-color:rgba(74,158,255,.3)}
      .activity-wrap[data-state="searching"] .activity-orb-dot{background:#4a9eff;box-shadow:0 0 8px rgba(74,158,255,.5)}
      .activity-wrap[data-state="imaging"]  .activity-orb-ring{border-top-color:#fbbf24;border-right-color:rgba(251,191,36,.3)}
      .activity-wrap[data-state="imaging"]  .activity-orb-dot{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.5)}
      @keyframes orbSpin{to{transform:rotate(360deg)}}
      .activity-right{display:flex;flex-direction:column;gap:3px;min-width:0}
      .activity-label{font-size:12px;font-weight:600;letter-spacing:.2px}
      .activity-wrap[data-state="thinking"] .activity-label{color:#a855f7}
      .activity-wrap[data-state="writing"]  .activity-label{color:#999}
      .activity-wrap[data-state="coding"]   .activity-label{color:#4ade80}
      .activity-wrap[data-state="searching"] .activity-label{color:#4a9eff}
      .activity-wrap[data-state="imaging"]  .activity-label{color:#fbbf24}
      .activity-sub{font-size:11px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;font-style:italic}
      .anim-dots::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
      @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

      /* think block */
      .ai-think{margin-bottom:10px;border:1px solid #1e1530;border-radius:12px;overflow:hidden;background:#080810}
      .ai-think-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#0d0b14;cursor:pointer;user-select:none}
      .ai-think-hdr:active{background:#120f1c}
      .ai-think-chev{transition:transform .25s ease;color:#7c3aed;flex-shrink:0}
      .ai-think.open .ai-think-chev{transform:rotate(90deg)}
      .ai-think-lbl{font-size:12px;font-weight:600;color:#9d71e8;letter-spacing:.3px;flex:1}
      .ai-think.streaming .ai-think-lbl::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
      .ai-think-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
      .ai-think.open .ai-think-body{max-height:500px;overflow-y:auto}
      .ai-think-content{padding:10px 12px 12px;font-size:12px;line-height:1.65;color:#6a5a9a;border-top:1px solid #1e1530;word-wrap:break-word;overflow-wrap:break-word;font-family:"M",Menlo,monospace;font-style:italic;white-space:pre-wrap}

      .think-search-pill{display:inline-flex;align-items:center;gap:6px;background:#0a1628;border:1px solid #1a3050;border-radius:99px;padding:4px 12px;margin:4px 0;font-size:11px;color:#4a9eff;font-style:normal;font-family:"M",sans-serif;white-space:nowrap}
      .think-search-dot{width:4px;height:4px;border-radius:50%;background:#4a9eff;animation:sPulse 1.2s ease-in-out infinite;flex-shrink:0}
      .think-search-dot:nth-child(2){animation-delay:.15s}
      .think-search-dot:nth-child(3){animation-delay:.3s}
      @keyframes sPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

      /* code */
      .code-wrap{margin:10px 0;border-radius:10px;overflow:hidden;background:#0a0a0a;border:1px solid #1a1a1a}
      .code-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#111;border-bottom:1px solid #1a1a1a}
      .code-lang{font-size:11px;color:#666}
      .code-hdr-btns{display:flex;gap:5px;align-items:center}
      .copy-code,.dl-btn,.view-btn{padding:4px 10px;background:#1a1a1a;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .15s;border:none}
      .copy-code{color:#aaa} .copy-code:active{background:#252525}
      .dl-btn{color:#4a9eff} .dl-btn:active{background:#252525}
      .view-btn{color:#4ade80} .view-btn:active{background:#252525}
      .ai-txt pre{padding:12px;overflow-x:auto;margin:0;background:#0a0a0a}
      .ai-txt pre code{background:none;padding:0;font-family:"M",Menlo,monospace;font-size:13px;color:#ccc;line-height:1.5}

      .msg-acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
      .ma-btn{padding:5px 10px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;color:#888;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .15s,transform .1s}
      .ma-btn:active{background:#1a1a1a;transform:scale(.94)}
      .msg-ts{font-size:10px;color:#444;margin-top:4px}
      .web-badge{display:inline-flex;align-items:center;gap:5px;background:#0a1628;border:1px solid #1a3050;border-radius:6px;padding:3px 8px;font-size:11px;color:#4a9eff;margin-bottom:8px}

      /* sources */
      .sources-wrap{margin-top:10px;border-top:1px solid #141414;padding-top:8px}
      .sources-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#444;cursor:pointer;user-select:none;padding:2px 0 6px;background:none;border:none;transition:color .15s}
      .sources-toggle:active{color:#888}
      .sources-chev{transition:transform .28s cubic-bezier(.4,0,.2,1);flex-shrink:0}
      .sources-wrap.open .sources-chev{transform:rotate(90deg)}
      .sources-list{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease;opacity:0}
      .sources-wrap.open .sources-list{max-height:600px;opacity:1}
      .source-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;text-decoration:none}
      .source-favicon{width:14px;height:14px;border-radius:3px;flex-shrink:0;margin-top:2px;object-fit:contain}
      .source-text{flex:1;min-width:0}
      .source-name{font-size:12px;color:#4a9eff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-decoration:underline}
      .source-url{font-size:10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

      /* input */
      #input-area{flex-shrink:0;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #141414}
      .input-box{background:#0a0a0a;border:1px solid #1e1e1e;border-radius:18px;display:flex;flex-direction:column;transition:border-color .2s;overflow:hidden}
      .input-box:focus-within{border-color:#333}
      .input-tools{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0}
      .input-tools::-webkit-scrollbar{display:none}
      .input-row{display:flex;align-items:flex-end;padding:4px 6px 6px 8px;gap:6px}
      #user-input{flex:1;color:#fff;font-size:15px;line-height:1.4;resize:none;max-height:140px;min-height:32px;padding:7px 4px;overflow-y:auto;background:transparent}
      #user-input::placeholder{color:#444}
      .send-btn{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s;color:#000}
      .send-btn:active{transform:scale(.9)}
      .send-btn:disabled{background:#2a2a2a;color:#555;opacity:.6}

      /* model button — plain text, no fill */
      .model-btn{height:30px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;border:1px solid #252525;color:#666;transition:border-color .15s,color .15s,transform .1s;font-size:12px;font-weight:700;letter-spacing:.5px;white-space:nowrap;gap:5px}
      .model-btn:active{transform:scale(.9);border-color:#444;color:#aaa}

      /* model popup — all text, no fill cards */
      #mp-popup{position:fixed;z-index:9998;background:#0d0d0d;border:1px solid #222;border-radius:16px;padding:6px;width:230px;box-shadow:0 16px 48px rgba(0,0,0,.9);display:none;pointer-events:auto}
      #mp-popup.open{display:block;animation:mpPop .15s cubic-bezier(.34,1.56,.64,1)}
      @keyframes mpPop{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
      #mp-overlay{position:fixed;inset:0;z-index:9997;display:none;background:transparent}
      #mp-overlay.open{display:block}
      .mp-head{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#444;padding:6px 10px 8px}

      /* model items — plain text style, no colored card */
      .mp-item{padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;margin-bottom:2px;display:flex;align-items:center;gap:10px}
      .mp-item:last-child{margin-bottom:0}
      .mp-item:active{opacity:.8}
      .mp-item.sel{border-color:#2a2a2a;background:#141414}

      /* text-only model name with badge beside it */
      .mp-label-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
      .mp-name{font-size:13px;font-weight:700;color:#ddd}
      .mp-item.sel .mp-name{color:#fff}

      /* Fast / Rapid badges: colored outline + text, no fill */
      .mp-badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center}
      .mp-badge.fast{color:#4a9eff;border:1px solid #1a3050}
      .mp-badge.rapid{color:#ef4444;border:1px solid #3a1010}

      .mp-desc{font-size:11px;color:#555;line-height:1.3}
      .mp-item.sel .mp-desc{color:#666}

      /* mode buttons */
      .mode-btn{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12px;color:#555;border:1px solid #1e1e1e;background:transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
      .mode-btn.active{color:#4a9eff;border-color:#1a3050;background:#0a1628}
      .mode-btn.active.green{color:#4ade80;border-color:#1a3520;background:#0a1a10}
      .mode-btn.active.amber{color:#fbbf24;border-color:#352a10;background:#1a1500}
      .mode-btn svg{flex-shrink:0}

      /* image notice — no em dash */
      #image-notice{display:none;text-align:center;font-size:10.5px;color:#ffe066;text-shadow:0 0 10px rgba(255,224,50,.45);padding:6px 14px 0;line-height:1.5}
      #image-notice.show{display:block}

      .stream-cur{display:inline-block;width:2px;height:15px;background:#666;margin-left:2px;vertical-align:text-bottom;animation:blink .8s infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

      #stop-row{display:flex;justify-content:center;padding:10px 0}
      .stop-btn{padding:9px 18px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:99px;color:#ddd;font-size:13px;display:flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
      .stop-btn:active{background:#252525;transform:scale(.96)}

      .err-row{padding:0 14px;margin:6px 0}
      .err-box{background:#1a0a0a;border:1px solid #3a1515;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
      .err-msg{flex:1;font-size:13px;color:#cc8080}
      .retry-btn{padding:6px 12px;background:#2a1010;border:1px solid #3a1515;border-radius:7px;color:#e0a0a0;font-size:12px}

      #scroll-btn{position:absolute;bottom:14px;right:14px;width:40px;height:40px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ddd;opacity:0;pointer-events:none;transform:translateY(12px) scale(.85);transition:opacity .25s,transform .25s;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.5)}
      #scroll-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
      #scroll-btn:active{transform:scale(.9)}

      /* sidebar */
      #sidebar-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
      #sidebar-ov.show{opacity:1;pointer-events:auto}
      #sidebar{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:320px;background:#0a0a0a;border-right:1px solid #1a1a1a;z-index:100;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      #sidebar.open{transform:translateX(0)}
      .sb-head{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #141414}
      .sb-logo{width:36px;height:36px;object-fit:contain;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important;flex-shrink:0}
      .sb-new{margin:12px;padding:12px 16px;background:#fff;color:#000;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
      .sb-new:active{transform:scale(.97)}
      .sb-search{margin:0 12px 8px;padding:10px 12px;background:#141414;border-radius:10px;display:flex;align-items:center;gap:8px}
      .sb-search svg{color:#555;flex-shrink:0}
      .sb-search input{flex:1;color:#ddd;font-size:14px;min-width:0}
      .sb-search input::placeholder{color:#444}
      .sb-lbl{padding:10px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#444}
      .chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}
      .chat-item{padding:12px;border-radius:10px;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .15s;cursor:pointer}
      .chat-item:active{background:#141414} .chat-item.active{background:#1a1a1a}
      .chat-item svg{color:#555;flex-shrink:0}
      .chat-item-txt{flex:1;font-size:14px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .chat-item.active .chat-item-txt{color:#fff}
      .chat-del{padding:6px;color:#444;border-radius:6px;display:flex;align-items:center;transition:background .15s,color .15s}
      .chat-del:active{background:#2a1010;color:#cc6666}
      .empty-list{padding:40px 16px;text-align:center;color:#444;font-size:13px}
      .sb-foot{padding:8px;border-top:1px solid #141414;display:flex;flex-direction:column;gap:2px}
      .sb-fbtn{padding:12px;border-radius:10px;display:flex;align-items:center;gap:10px;color:#aaa;font-size:14px;text-align:left;transition:background .15s;cursor:pointer}
      .sb-fbtn:active{background:#141414} .sb-fbtn.danger{color:#cc6666} .sb-fbtn.danger:active{background:#1a0808}

      /* dialog */
      #dialog-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
      #dialog-ov.show{display:flex}
      #dialog-box{background:#141414;border:1px solid #252525;border-radius:18px;padding:22px 20px 16px;width:100%;max-width:340px;animation:dialogIn .25s cubic-bezier(.34,1.56,.64,1)}
      @keyframes dialogIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
      #dialog-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:6px}
      #dialog-msg{font-size:14px;color:#888;line-height:1.5;margin-bottom:16px}
      #dialog-input-wrap{margin-bottom:16px}
      #dialog-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:15px;padding:12px;transition:border-color .2s}
      #dialog-input:focus{border-color:#444}
      #dialog-btns{display:flex;gap:8px}
      .dlg-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;transition:transform .1s,background .15s}
      .dlg-btn:active{transform:scale(.96)}
      .dlg-btn.cancel{background:#1a1a1a;color:#aaa} .dlg-btn.cancel:active{background:#252525}
      .dlg-btn.confirm{background:#fff;color:#000} .dlg-btn.confirm:active{background:#ddd}
      .dlg-btn.danger{background:#2a1010;color:#e06060} .dlg-btn.danger:active{background:#3a1515}

      /* settings */
      #settings-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center}
      #settings-ov.show{display:flex}
      #settings-sheet{background:#0a0a0a;border-radius:20px 20px 0 0;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:sheetUp .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}
      @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
      .sheet-handle{width:40px;height:4px;background:#333;border-radius:2px;margin:10px auto 6px;flex-shrink:0}
      .sheet-head{padding:8px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #141414;flex-shrink:0}
      .sheet-title{font-size:17px;font-weight:700;color:#fff}
      .sheet-x{width:32px;height:32px;border-radius:50%;background:#141414;color:#888;display:flex;align-items:center;justify-content:center;transition:background .15s}
      .sheet-x:active{background:#252525}
      .sheet-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
      .sg{margin-bottom:22px}
      .sg-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:10px}
      .s-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #141414;gap:12px}
      .s-row:last-child{border-bottom:none}
      .s-row-info{flex:1;min-width:0}
      .s-name{font-size:14px;color:#ddd} .s-desc{font-size:12px;color:#555;margin-top:2px}
      .tog{width:48px;height:28px;background:#2a2a2a;border-radius:99px;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
      .tog.on{background:#4ade80}
      .tog::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 4px rgba(0,0,0,.3)}
      .tog.on::after{transform:translateX(20px)}
      .sl-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
      input[type="range"]{-webkit-appearance:none;width:110px;height:4px;background:#2a2a2a;border-radius:99px}
      input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#fff;border-radius:50%;cursor:pointer}
      .sl-v{font-size:13px;color:#aaa;min-width:38px;text-align:right}
      .s-btn{padding:8px 14px;background:#2a1010;border:1px solid #3a1515;border-radius:8px;color:#e06060;font-size:13px;font-weight:600;transition:background .15s,transform .1s;cursor:pointer}
      .s-btn:active{background:#3a1515;transform:scale(.96)}

      /* view */
      #view-ov{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column}
      #view-ov.show{display:flex}
      .view-topbar{flex-shrink:0;display:flex;align-items:center;padding:0 12px;gap:10px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;padding-top:env(safe-area-inset-top);height:calc(50px + env(safe-area-inset-top))}
      .view-title{flex:1;font-size:14px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .view-close{width:36px;height:36px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#aaa;transition:background .15s;cursor:pointer}
      .view-close:active{background:#252525}
      .view-frame-wrap{flex:1;overflow:hidden;background:#fff}
      .view-frame-wrap iframe{width:100%;height:100%;border:none}

      .ai-image{margin:12px 0;border-radius:12px;overflow:hidden;max-width:100%;border:1px solid #1a1a1a}
      .ai-image img{width:100%;height:auto;display:block}
      .continue-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#4a9eff}
      .continue-btn:active{background:#252525}

      body.code-mode .ai-txt code:not(pre code){color:#fff;background:#111}
      body.code-mode .code-wrap{border:1px solid #333;background:#050505;box-shadow:0 0 0 1px #222,0 0 12px rgba(255,255,255,.05)}
      body.code-mode .ai-txt pre code{color:#fff;font-size:14px}
    </style>
  </head>
  <body>
    <div id="intro">
      <div id="intro-pulse"></div>
      <img id="intro-logo" src="icon.webp" alt=""/>
    </div>

    <div id="app">
      <div id="topbar">
        <button class="tb-btn" onclick="openSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="tb-center"><div class="tb-title" id="tb-title"></div></div>
        <button class="tb-btn" onclick="newChat()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>

      <div id="chat-wrap">
        <div id="chat-area"></div>
        <button id="scroll-btn" onclick="scrollBot(true)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <div id="input-area">
        <div class="input-box">
          <div class="input-tools">
            <button class="mode-btn" id="web-btn" onclick="toggleMode('web')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Search
            </button>
            <button class="mode-btn" id="code-btn" onclick="toggleMode('code')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              Code
            </button>
            <button class="mode-btn" id="image-btn" onclick="toggleMode('image')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Image
            </button>
          </div>
          <div class="input-row">
            <!-- Model button: plain text, shows current model key -->
            <button class="model-btn" id="model-btn" onclick="openModelPicker(event)">0</button>
            <textarea id="user-input" placeholder="Message 0..." rows="1" oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMsg()" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
        <!-- Image notice: no em dash -->
        <div id="image-notice">Text-to-Image is in alpha. Quality may vary.</div>
      </div>
    </div>

    <!-- Model picker -->
    <div id="mp-overlay" onclick="closeModelPicker()"></div>
    <div id="mp-popup">
      <div class="mp-head">Select Model</div>

      <!-- 0: no badge -->
      <div class="mp-item sel" id="mp-item-0" onclick="selectModel('0')">
        <div class="mp-info">
          <div class="mp-label-row">
            <div class="mp-name">0</div>
          </div>
          <div class="mp-desc">Balanced. No thinking. Fast replies.</div>
        </div>
      </div>

      <!-- 00: Fast badge -->
      <div class="mp-item" id="mp-item-00" onclick="selectModel('00')">
        <div class="mp-info">
          <div class="mp-label-row">
            <div class="mp-name">00</div>
            <span class="mp-badge fast">Fast</span>
          </div>
          <div class="mp-desc">Better accuracy with reasoning.</div>
        </div>
      </div>

      <!-- 000: Rapid badge -->
      <div class="mp-item" id="mp-item-000" onclick="selectModel('000')">
        <div class="mp-info">
          <div class="mp-label-row">
            <div class="mp-name">000</div>
            <span class="mp-badge rapid">Rapid</span>
          </div>
          <div class="mp-desc">Thinking enabled. Top tier.</div>
        </div>
      </div>
    </div>

    <div id="sidebar-ov" onclick="closeSidebar()"></div>
    <div id="sidebar">
      <div class="sb-head"><img class="sb-logo" src="icon.webp" alt=""/></div>
      <button class="sb-new" onclick="newChat();closeSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New conversation
      </button>
      <div class="sb-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search chats" oninput="filterSB(this.value)"/>
      </div>
      <div class="sb-lbl">Conversations</div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sb-foot">
        <button class="sb-fbtn" onclick="openSettings()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
        <button class="sb-fbtn danger" onclick="clearAll()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Clear all
        </button>
      </div>
    </div>

    <div id="dialog-ov">
      <div id="dialog-box">
        <div id="dialog-title"></div>
        <div id="dialog-msg"></div>
        <div id="dialog-input-wrap" style="display:none"><input id="dialog-input" type="text"/></div>
        <div id="dialog-btns"></div>
      </div>
    </div>

    <div id="settings-ov" onclick="if(event.target===this)closeSettings()">
      <div id="settings-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-title">Settings</div>
          <button class="sheet-x" onclick="closeSettings()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <div id="view-ov">
      <div class="view-topbar">
        <div class="view-title" id="view-title">View</div>
        <button class="view-close" onclick="closeView()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="view-frame-wrap">
        <iframe id="view-frame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
      </div>
    </div>

    <script>
    "use strict";
    if(typeof marked==="undefined")window.marked={parse:s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")};
    if(typeof DOMPurify==="undefined")window.DOMPurify={sanitize:s=>s};

    /* ══════════════════════════════════════
       MODELS
    ══════════════════════════════════════ */
    const MODELS = {
      '0':   { key:'0',   label:'0',   placeholder:'Message 0...',   hasThink:false, temp:0.5 },
      '00':  { key:'00',  label:'00',  placeholder:'Message 00...',  hasThink:true,  temp:0.4 },
      '000': { key:'000', label:'000', placeholder:'Message 000...', hasThink:true,  temp:0.3 },
    };

    /* ══════════════════════════════════════
       PROMPTS
    ══════════════════════════════════════ */
    const PROMPT = {
      codeAdd: `\n\n[CODE MODE: Working code only. Fenced code blocks with correct language tags. Concise.]`,
      think: `You are the internal reasoning engine for 0v AI.
Think step by step through the user's message. Write raw reasoning only.
No final answer. No greetings. No markdown headers. Plain text only.
Be concise but thorough.

CRITICAL: If you do not know something, are uncertain, or the question needs current/live information, write exactly <<SEARCH>> on its own line. This will trigger a live web search before the answer is generated.

Do not reveal that you are reasoning. This is internal only.`,
    };

    /* ══════════════════════════════════════
       STATE
    ══════════════════════════════════════ */
    const S = {
      convos:{}, activeId:null, busy:false, abort:null,
      model:'0',
      modes:new Set(),
      settings:{
        timestamps:false, autoscroll:true,
        save:true, temperature:0.5, webSearchAuto:true,
      },
    };

    /* ══════════════════════════════════════
       MODEL PICKER
    ══════════════════════════════════════ */
    function openModelPicker(e) {
      e.stopPropagation();
      const popup = document.getElementById('mp-popup');
      const ov    = document.getElementById('mp-overlay');
      const btn   = document.getElementById('model-btn');
      const rect  = btn.getBoundingClientRect();
      const popW  = 230;
      let left    = rect.left;
      let bottom  = window.innerHeight - rect.top + 8;
      if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
      if (left < 8) left = 8;
      popup.style.left   = left + 'px';
      popup.style.bottom = bottom + 'px';
      popup.style.top    = 'auto';
      ov.classList.add('open');
      popup.classList.add('open');
    }
    function closeModelPicker() {
      document.getElementById('mp-popup').classList.remove('open');
      document.getElementById('mp-overlay').classList.remove('open');
    }
    function selectModel(key) {
      closeModelPicker();
      const m = MODELS[key]; if (!m) return;
      S.model = key;
      // Update button: plain text label only
      const btn = document.getElementById('model-btn');
      btn.textContent = m.label;
      document.getElementById('user-input').placeholder = m.placeholder;
      ['0','00','000'].forEach(k => {
        document.getElementById('mp-item-' + k)?.classList.toggle('sel', k === key);
      });
    }

    /* ══════════════════════════════════════
       MODES
    ══════════════════════════════════════ */
    function toggleMode(m) {
      if (S.modes.has(m)) S.modes.delete(m); else S.modes.add(m);
      updateModeUI();
      document.body.classList.toggle('code-mode', S.modes.has('code'));
      document.getElementById('image-notice')?.classList.toggle('show', S.modes.has('image'));
    }
    function updateModeUI() {
      const cm = {code:'green',image:'amber'};
      ['web','code','image'].forEach(m => {
        const btn = document.getElementById(m+'-btn'); if (!btn) return;
        btn.classList.toggle('active', S.modes.has(m));
        btn.classList.remove('green','amber');
        if (S.modes.has(m) && cm[m]) btn.classList.add(cm[m]);
      });
    }
    function modeOn(m) { return S.modes.has(m); }

    /* ══════════════════════════════════════
       DATE / TIME
    ══════════════════════════════════════ */
    function dtCtx() {
      const n = new Date();
      return `\n\n[Live — always accurate]\nDate: ${n.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}\nTime: ${n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZoneName:'short'})}`;
    }

    /* ══════════════════════════════════════
       SEARCH
    ══════════════════════════════════════ */
    const ALWAYS_SEARCH_RE = [
      /\b(202[4-9]|20[3-9]\d)\b/,
      /\b(today|right now|as of today|this week|this month|this year)\b/i,
      /\b(latest|newest|most recent|current version)\b/i,
      /\b(live (score|result|price|rate)|real.?time)\b/i,
      /\b(stock price|crypto price|bitcoin|exchange rate|weather (in|today|now|forecast))\b/i,
      /\b(breaking news|just happened|just announced|just released)\b/i,
    ];
    const THINK_SEARCH_RE = [
      /<<SEARCH>>/,
      /i (don'?t|do not) (know|have|have information about|have data on)/i,
      /i('?m| am) not sure (about|of|what|who|when|where|how)/i,
      /i('?m| am) (unsure|uncertain|unaware)/i,
      /i (can'?t|cannot) (confirm|verify|recall|remember)/i,
      /my (knowledge|training|data).{0,30}(cut.?off|limited|outdated|old)/i,
      /not (certain|sure) (if|whether|about)/i,
      /(never heard of|unfamiliar with|don'?t recognize)/i,
      /need(s)? to (search|look up|check)/i,
    ];

    function userQueryNeedsSearch(text) {
      if (modeOn('web')) return true;
      if (modeOn('image') || !text) return false;
      if (!S.settings.webSearchAuto) return false;
      const t = text.trim();
      if (t.length < 6) return false;
      if (/^(hi|hello|hey|thanks?|ok|bye|yes|no|sure|lol|hm+|um+)[\s!.?]*$/i.test(t)) return false;
      return ALWAYS_SEARCH_RE.some(r => r.test(t));
    }
    function thinkTextNeedsSearch(thinkText) {
      if (!thinkText) return false;
      return THINK_SEARCH_RE.some(r => r.test(thinkText));
    }
    async function doSearch(q) {
      try {
        const r = await fetch('/api/search.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
        if (!r.ok) return null;
        const d = await r.json();
        return (d.results?.length || d.answer) ? d : null;
      } catch(e) { return null; }
    }
    function buildSearchCtx(sd) {
      if (!sd) return '';
      let c = '\n\n--- WEB SEARCH RESULTS ---\n';
      c += `(Today: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})})\n\n`;
      if (sd.answer) c += `DIRECT ANSWER: ${sd.answer}\n\n`;
      (sd.results||[]).forEach((r,i) => { c += `[${i+1}] ${r.title}\nURL: ${r.url}\n${r.snippet}\n\n`; });
      c += '--- USE THE ABOVE TO ANSWER. ---\n';
      return c;
    }

    /* ══════════════════════════════════════
       INIT
    ══════════════════════════════════════ */
    let inited = false;
    function init() {
      if (inited) return; inited = true;
      try { loadStore(); renderSB(); showEmpty(); setupScroll(); setupInput(); updateModeUI(); }
      catch(e) { console.error(e); }
      setTimeout(() => {
        document.getElementById('intro')?.classList.add('hide');
        document.getElementById('app')?.classList.add('ready');
        setTimeout(() => { const i=document.getElementById('intro'); if(i)i.style.display='none'; }, 1000);
      }, 2600);
    }
    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState !== 'loading') init();

    function setupScroll() {
      const ca = document.getElementById('chat-area'); if (!ca) return;
      ca.addEventListener('scroll', () => {
        const far = ca.scrollHeight - ca.scrollTop - ca.clientHeight > 120;
        document.getElementById('scroll-btn')?.classList.toggle('show', far);
      });
    }
    function setupInput() {
      const inp = document.getElementById('user-input'); if (!inp) return;
      inp.addEventListener('input', () => {
        const btn = document.getElementById('send-btn');
        if (btn) btn.disabled = !inp.value.trim() || S.busy;
      });
    }

    /* ══════════════════════════════════════
       STORAGE
    ══════════════════════════════════════ */
    function saveStore() {
      if (!S.settings.save) return;
      try {
        localStorage.setItem('vg_convos', JSON.stringify(S.convos));
        localStorage.setItem('vg_settings', JSON.stringify(S.settings));
      } catch(e) {}
    }
    function loadStore() {
      try {
        const c = localStorage.getItem('vg_convos'); if (c) S.convos = JSON.parse(c)||{};
        const s = localStorage.getItem('vg_settings'); if (s) S.settings = {...S.settings,...JSON.parse(s)};
      } catch(e) { S.convos={}; }
    }

    /* ══════════════════════════════════════

    function buildMsg(msg, idx) {
      const ts = S.settings.timestamps&&msg.ts
        ? `<div class="msg-ts">${new Date(msg.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>` : '';

      if (msg.role==='user') {
        return `<div class="msg-row user"><div class="msg-in"><div class="u-bubble">${esc(msg.content)}</div>${ts}</div></div>`;
      }

      const cma = msg.codeMode ? 'data-codemode="true"' : '';
      const badge = msg.searched
        ? `<div class="web-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Searched the web</div>` : '';

      let thinkHtml = '';
      if (msg.thinking && msg.thinking.trim()) {
        const dur = msg.thinkDuration ? `Thought for ${msg.thinkDuration}s` : 'Thought';
        thinkHtml = `<div class="ai-think" onclick="this.classList.toggle('open')">
          <div class="ai-think-hdr">
            <svg class="ai-think-chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

          </div>
          <div class="ai-think-body"><div class="ai-think-content">${esc(msg.thinking)}</div></div>

      let sourcesHtml = '';

        const items = msg.sources.map(s => {
          let h=''; try{h=new URL(s.url).hostname.replace('www.','');}catch(e){h=s.url;}
          return `<a class="source-item" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">

        sourcesHtml = `<div class="sources-wrap">
          <button class="sources-toggle" onclick="toggleSources(this)">
            <svg class="sources-chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            Sources (${msg.sources.length})
          </button>
          <div class="sources-list">${items}</div>
        </div>`;
      }

      const html = DOMPurify.sanitize(marked.parse(msg.content||''));
      let imgHtml = ''; if(msg.imageUrl) imgHtml=`<div class="ai-image"><img src="${esc(msg.imageUrl)}" alt="Generated image" loading="lazy"/></div>`;
      let acts = '';
      if(msg.truncated) acts=`<button class="ma-btn continue-btn" onclick="continueMsg(${idx})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>Continue</button>`;

      return `<div class="msg-row ai" data-msg-index="${idx}" ${cma}><div class="msg-in"><div class="msg-content">

          ${sourcesHtml}${ts}

    /* ── DOWNLOAD FIX: map language → extension without appending extra .txt ── */
    const EXT = {
      html:'html', htm:'html', css:'css', scss:'scss',
      javascript:'js', js:'js', jsx:'jsx',
      typescript:'ts', ts:'ts', tsx:'tsx',
      python:'py', py:'py', java:'java',
      c:'c', cpp:'cpp', csharp:'cs', cs:'cs',
      go:'go', rust:'rs', rs:'rs', ruby:'rb', rb:'rb',
      php:'php', swift:'swift', kotlin:'kt', kt:'kt',
      sql:'sql', json:'json', xml:'xml',
      yaml:'yml', yml:'yml', markdown:'md', md:'md',
      bash:'sh', sh:'sh', shell:'sh',
      vue:'vue', svelte:'svelte', dart:'dart', lua:'lua',
    };
    function downloadCode(btn){
      const codeEl = btn.closest('.code-wrap').querySelector('code'); if(!codeEl)return;
      const rawLang = (btn.dataset.lang || 'code').toLowerCase().replace(/^language-/,'');
      const ext = EXT[rawLang] || rawLang || 'txt';
      // filename: "code.html" not "code.html.txt"
      const filename = `code.${ext}`;
      const mimeMap = { html:'text/html', css:'text/css', js:'application/javascript', json:'application/json', svg:'image/svg+xml' };
      const mime = mimeMap[ext] || 'text/plain';
      const blob = new Blob([codeEl.innerText], {type: mime + ';charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function viewCode(btn){
      const codeEl=btn.closest('.code-wrap').querySelector('code'); if(!codeEl)return;
      const code=codeEl.innerText; const lang=(btn.dataset.lang||'code').toLowerCase().replace('language-',''); let html='';
      if(lang==='html'||lang==='htm'){html=code;}
      else if(lang==='css'||lang==='scss'){html=`<!DOCTYPE html><html><head><style>body{font-family:system-ui,sans-serif;padding:20px}${code}</style></head><body><h1>Heading</h1><p>Paragraph.</p><button>Button</button></body></html>`;}
      else if(['javascript','js','jsx','typescript','ts','tsx'].includes(lang)){html=`<!DOCTYPE html><html><head><style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:20px}pre{background:#1a1a1a;padding:12px;border-radius:8px}.error{color:#ff6b6b}</style></head><body><div id="o"></div><script>const _o=document.getElementById('o');console.log=(...a)=>{_o.innerHTML+='<pre>'+a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'</pre>'};try{${code}}catch(e){_o.innerHTML+='<pre class="error">'+e.message+'</pre>'}<\/script></body></html>`;}
      else if(lang==='json'){try{html=`<!DOCTYPE html><html><head><style>body{font-family:monospace;background:#111;color:#eee;padding:20px;white-space:pre-wrap;font-size:13px}</style></head><body>${esc(JSON.stringify(JSON.parse(code),null,2))}</body></html>`;}catch(e){html=`<body style="background:#111;color:#f66;padding:20px">Invalid JSON</body>`;}}
      else if(lang==='svg'){html=`<!DOCTYPE html><html><head><style>body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}</style></head><body>${code}</body></html>`;}
      else{html=`<!DOCTYPE html><html><head><style>body{font-family:monospace;background:#111;color:#eee;padding:20px;white-space:pre-wrap;font-size:13px}</style></head><body>${esc(code)}</body></html>`;}
      document.getElementById('view-title').textContent=`View · ${lang}`;
      document.getElementById('view-frame').srcdoc=html;
      document.getElementById('view-ov').classList.add('show');
    }
    function closeView(){ document.getElementById('view-frame').srcdoc=''; document.getElementById('view-ov').classList.remove('show'); }

      const inp=document.getElementById('user-input'); if(!inp)return;

      const c=ensureConvo();
      c.msgs.push({role:'user',content:raw,ts:Date.now()});
      if(c.msgs.length===1){c.title=mkTitle(raw);setTitle(c.title);}
      c.ts=Date.now();
      inp.value=''; autoGrow(inp);
      const sb=document.getElementById('send-btn'); if(sb)sb.disabled=true;
      renderMsgs(); renderSB();

      if(modeOn('image')){
        await genImage(c,raw); S.busy=false;
        if(sb)sb.disabled=!inp.value.trim(); return;
      }

      let searchData=null;
      if(userQueryNeedsSearch(raw)){
        showSearchInd();
        searchData=await doSearch(raw);
        hideSearchInd();
      }

      const aiId='ai'+Date.now();
      appendPending(aiId);
      await generate(c,aiId,searchData,raw);
    }

    /* ══════════════════════════════════════
       CORE API CALL
    ══════════════════════════════════════ */
    async function apiCall(msgs, sys, modelKey, maxTok, onDelta) {
      const mDef = MODELS[modelKey] || MODELS['0'];
      if (!S.abort || S.abort.signal.aborted) {
        S.abort = new AbortController();
      }
      const res = await fetch('/api/chat.js', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          messages: msgs,
          systemPrompt: sys,
          temperature: mDef.temp,
          maxTokens: maxTok || 4096,
          model: modelKey,
        }),
        signal: S.abort.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      let full='', fr=null;
      if (res.body) {
        const reader=res.body.getReader(); const dec=new TextDecoder();
        while(true){
          const {done,value}=await reader.read(); if(done)break;
          const chunk=dec.decode(value,{stream:true});
          for(const line of chunk.split('\n')){
            if(!line.startsWith('data: '))continue;
            const data=line.slice(6).trim(); if(data==='[DONE]')continue;
            try{
              const d=JSON.parse(data);
              const delta=d.choices?.[0]?.delta?.content||'';
              if(delta){full+=delta; if(onDelta)onDelta(delta,full);}
              if(d.choices?.[0]?.finish_reason)fr=d.choices[0].finish_reason;
            }catch(e){}
          }
        }
      } else {
        const d=await res.json();
        full=d.choices?.[0]?.message?.content||'';
        fr=d.choices?.[0]?.finish_reason;
        if(onDelta&&full)onDelta(full,full);
      }
      return {full:full.trim(), finishReason:fr};
    }

    /* ══════════════════════════════════════
       STREAM TEXT
    ══════════════════════════════════════ */
    async function streamWords(el, text, onChunk) {
      if (!text) { el.innerHTML=''; return; }
      const parts = text.split(/(\s+)/);
      let built = '';
      for (let i=0; i<parts.length; i++) {
        if (S.abort?.signal?.aborted) break;
        built += parts[i];
        el.innerHTML = DOMPurify.sanitize(marked.parse(built)) + '<span class="stream-cur"></span>';
        if (onChunk) onChunk();
        await sleep(parts[i].trim() ? 14 : 4);
      }
      el.innerHTML = DOMPurify.sanitize(marked.parse(built));
    }
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    /* ══════════════════════════════════════
       MAIN GENERATE
    ══════════════════════════════════════ */
    async function generate(convo, aiId, searchData, userQuery, contMode) {
      contMode = contMode||false;
      S.busy   = true;

      const txtEl   = document.getElementById(aiId+'txt');
      const thinkEl = document.getElementById(aiId+'think');
      const thCont  = document.getElementById(aiId+'thcont');
      const thLbl   = document.getElementById(aiId+'thlbl');

      const modelKey = S.model;
      const mDef     = MODELS[modelKey] || MODELS['0'];
      const useThink = mDef.hasThink;
      const baseMsgs = convo.msgs.map(m=>({role:m.role,content:m.content}));

      let thinkText    = null;
      let answerText   = null;
      let finishReason = null;
      let usedSearch   = !!searchData;
      let finalSources = searchData?.results||[];
      let thinkDurStr  = null;

      S.abort = new AbortController();

      try {
        if (useThink) {
          /* PHASE 1: REASONING */
          const tStart = Date.now();
          let thinkSys = PROMPT.think + dtCtx();
          if (searchData && (searchData.results?.length||searchData.answer)) {
            thinkSys += buildSearchCtx(searchData);
          }
          if (thCont) thCont.textContent = '';
          S.abort = new AbortController();
          let rawThink = '';
          try {
            const result = await apiCall(
              baseMsgs, thinkSys, modelKey, 700,
              (delta, full) => {
                rawThink = full;
                if (thCont) {
                  thCont.textContent = full.replace(/<<SEARCH>>/g,'').trimStart();
                  if (S.settings.autoscroll) scrollBot();
                }
              }
            );
            rawThink = result.full;
          } catch(e) {
            if (e.name === 'AbortError') throw e;
            rawThink = '';
          }

          thinkText = rawThink.replace(/<<SEARCH>>/g,'').trim() || null;
          const tEnd = Date.now();
          thinkDurStr = ((tEnd - tStart) / 1000).toFixed(1);

          /* Check if think wants search */
          if (!searchData && thinkTextNeedsSearch(rawThink)) {
            if (thCont) {
              const pill = document.createElement('div');
              pill.style.cssText = 'margin-top:6px';
              pill.innerHTML = `<div class="think-search-pill"><div class="think-search-dot"></div><div class="think-search-dot"></div><div class="think-search-dot"></div>Searching the web</div>`;
              thCont.appendChild(pill);
              if (S.settings.autoscroll) scrollBot();
            }
            const q = userQuery || baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content || '';
            const sd = await doSearch(q);
            const pill = thCont?.querySelector('.think-search-pill');
            if (pill) pill.parentElement?.remove();
            if (sd) { searchData=sd; usedSearch=true; finalSources=sd.results||[]; }
          }

          if (thinkEl) { thinkEl.classList.remove('streaming'); thinkEl.classList.remove('open'); }
          if (thLbl) thLbl.textContent = `Thought for ${thinkDurStr}s`;
          if (thCont && thinkText) thCont.textContent = thinkText;

          await sleep(200);

          /* PHASE 2: ANSWER */
          if (txtEl) {
            txtEl.style.display = '';
            const aLabel = modeOn('code') ? 'Writing Code' : 'Writing';
            const aState = modeOn('code') ? 'coding' : 'writing';
            txtEl.innerHTML = `<div class="activity-wrap" data-state="${aState}">
              <div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div>
              <div class="activity-right"><div class="activity-label anim-dots">${aLabel}</div></div>
            </div>`;
            if (S.settings.autoscroll) scrollBot();
          }

          let ansSysExtra = dtCtx();
          if (modeOn('code')) ansSysExtra += PROMPT.codeAdd;
          if (searchData && (searchData.results?.length||searchData.answer)) ansSysExtra += buildSearchCtx(searchData);
          if (contMode) ansSysExtra += '\n\n[SYSTEM: Continue from where cut off. Do not repeat anything.]';

          const ansMsgs = [...baseMsgs];
          if (thinkText) {
            const lui = ansMsgs.map(m=>m.role).lastIndexOf('user');
            if (lui !== -1) {
              ansMsgs.splice(lui, 0, {
                role: 'system',
                content: `[Internal reasoning — use to inform your answer. Never reveal, repeat, or reference it.]\n\n${thinkText}`,
              });
            }
          }

          S.abort = new AbortController();
          let rawAnswer = '';
          try {
            const result = await apiCall(ansMsgs, ansSysExtra, modelKey, 3072, null);
            rawAnswer    = result.full;
            finishReason = result.finishReason;
          } catch(e) {
            if (e.name === 'AbortError') throw e;
            rawAnswer = '';
          }

          answerText = rawAnswer;
          if (txtEl) {
            const aw = txtEl.querySelector('.activity-wrap'); if (aw) aw.remove();
            txtEl.innerHTML = '';
            if (answerText) {
              await streamWords(txtEl, answerText, () => { if(S.settings.autoscroll)scrollBot(); });
            } else {
              txtEl.innerHTML = DOMPurify.sanitize(marked.parse('_(No response generated — try again)_'));
            }
          }

        } else {
          /* PATH B: NORMAL MODEL (0) */
          let sysExtra = dtCtx();
          if (modeOn('code')) sysExtra += PROMPT.codeAdd;
          if (searchData && (searchData.results?.length||searchData.answer)) sysExtra += buildSearchCtx(searchData);
          if (contMode) sysExtra += '\n\n[SYSTEM: Continue from where cut off. Do not repeat anything.]';

          const {full, finishReason:fr} = await apiCall(
            baseMsgs, sysExtra, modelKey, 4096,
            (delta, cur) => {
              if (txtEl) {
                const aw=txtEl.querySelector('.activity-wrap'); if(aw)aw.remove();
                txtEl.innerHTML=DOMPurify.sanitize(marked.parse(cur))+'<span class="stream-cur"></span>';
              }
              const subEl=document.getElementById(aiId+'sub');
              if (subEl && cur.length > 10) {
                const snip=cur.replace(/[#*`_\[\]]/g,'').trim().slice(-60);
                if (snip) subEl.textContent=snip;
              }
              if (S.settings.autoscroll) scrollBot();
            }
          );
          finishReason = fr;
          answerText   = full;
          if (txtEl) txtEl.innerHTML = DOMPurify.sanitize(marked.parse(answerText||''));

          /* Smart re-search */
          if (answerText && !usedSearch && S.settings.webSearchAuto) {
            const looksUncertain = (
              /i (don'?t|do not) (really |actually )?(know|have information)/i.test(answerText) ||
              /i('?m| am) not sure/i.test(answerText) ||
              /i (can'?t|cannot) (confirm|verify)/i.test(answerText) ||
              /my (knowledge|training).{0,30}(cut.?off|limit|outdated)/i.test(answerText) ||
              /i('?m| am) (unsure|uncertain)/i.test(answerText)
            );
            if (looksUncertain) {
              showSearchInd();
              const q=userQuery||baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content||'';
              const sd=await doSearch(q);
              hideSearchInd();
              if (sd) {
                searchData=sd; usedSearch=true; finalSources=sd.results||[];
                let sysExtra2 = dtCtx() + buildSearchCtx(sd);
                if(modeOn('code'))sysExtra2+=PROMPT.codeAdd;
                if(txtEl){
                  txtEl.innerHTML=`<div class="activity-wrap" data-state="writing">
                    <div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div>
                    <div class="activity-right"><div class="activity-label anim-dots">Re-answering</div></div>
                  </div>`;
                }
                S.abort=new AbortController();
                const {full:full2,finishReason:fr2}=await apiCall(baseMsgs,sysExtra2,modelKey,4096,(delta,cur)=>{
                  if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();txtEl.innerHTML=DOMPurify.sanitize(marked.parse(cur))+'<span class="stream-cur"></span>';}
                  if(S.settings.autoscroll)scrollBot();
                });
                finishReason=fr2; answerText=full2;
                if(txtEl)txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText||''));
              }
            }
          }
        }

      } catch(err) {
        if (err.name !== 'AbortError') {
          document.getElementById(aiId)?.remove();
          document.getElementById('stop-row')?.remove();
          showErr();
          S.busy=false; S.abort=null;
          const inp=document.getElementById('user-input');
          const sb=document.getElementById('send-btn');
          if(sb)sb.disabled=!inp||!inp.value.trim();
          return;
        }
        answerText = answerText || '';
      }

      document.getElementById(aiId)?.remove();
      document.getElementById('stop-row')?.remove();

      const savedAnswer = answerText || '';
      if (!savedAnswer && !thinkText) {
        convo.msgs.push({
          role:'assistant', content:'_(No response — tap Retry)_',
          ts:Date.now(), searched:usedSearch, sources:finalSources,
          codeMode:modeOn('code'), thinking:null, thinkDuration:null,
          truncated:false, emptyRetry:true, modelKey,
        });
      } else {
        convo.msgs.push({
          role:'assistant', content:savedAnswer,
          ts:Date.now(), searched:usedSearch, sources:finalSources,
          codeMode:modeOn('code'), thinking:thinkText, thinkDuration:thinkDurStr,
          truncated:finishReason==='length', modelKey,
        });
      }

      renderMsgs(); saveStore();
      S.busy=false; S.abort=null;
      const inp=document.getElementById('user-input');
      const sb=document.getElementById('send-btn');
      if(sb)sb.disabled=!inp||!inp.value.trim();
      scrollBot();
    }

    /* ══════════════════════════════════════
       RETRY / CONTINUE / IMAGE / STOP
    ══════════════════════════════════════ */
    async function retryEmpty(idx){
      const c=curConvo(); if(!c||S.busy)return;
      const msg=c.msgs[idx]; if(!msg||!msg.emptyRetry)return;
      c.msgs.splice(idx,1); renderMsgs();
      const um=c.msgs.filter(m=>m.role==='user').slice(-1)[0]; if(!um)return;
      const aiId='ai'+Date.now(); appendPending(aiId);
      await generate(c,aiId,null,um.content);
    }

    async function continueMsg(idx){
      const c=curConvo(); if(!c||S.busy)return;
      const msg=c.msgs[idx]; if(!msg||msg.role!=='assistant')return;
      msg.truncated=false;
      const msgRow=document.querySelector(`.msg-row.ai[data-msg-index="${idx}"]`);
      if(msgRow){const ad=msgRow.querySelector('.msg-acts');if(ad)ad.innerHTML=`<button class="stop-btn" onclick="stopGen()" style="padding:5px 12px;font-size:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>`;}
      const txtEl=document.getElementById(`msg-${idx}-text`); if(!txtEl)return;
      S.busy=true; S.abort=new AbortController();
      let sysExtra = dtCtx();
      if(msg.codeMode)sysExtra+=PROMPT.codeAdd;
      sysExtra+='\n\n[SYSTEM: Continue exactly where cut off. Do not repeat.]';
      const msgs=c.msgs.slice(0,idx+1).map(m=>({role:m.role,content:m.content}));
      let full=msg.content, fr=null;
      try{
        const r=await apiCall(msgs,sysExtra,msg.modelKey||S.model,4096,(delta,cur)=>{
          txtEl.innerHTML=DOMPurify.sanitize(marked.parse(cur))+'<span class="stream-cur"></span>';
          if(S.settings.autoscroll)scrollBot();
        });
        full=r.full; fr=r.finishReason;
      }catch(e){}
      txtEl.innerHTML=DOMPurify.sanitize(marked.parse(full));
      msg.content=full; msg.truncated=fr==='length'; msg.ts=Date.now();
      const ad=msgRow?.querySelector('.msg-acts');
      if(ad)ad.innerHTML=msg.truncated?`<button class="ma-btn continue-btn" onclick="continueMsg(${idx})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>Continue</button>`:'';
      attachCodeBtns(); saveStore(); S.busy=false; S.abort=null;
      const inp=document.getElementById('user-input');
      const sb=document.getElementById('send-btn');
      if(sb)sb.disabled=!inp||!inp.value.trim(); scrollBot();
    }

    async function genImage(convo,prompt){
      S.busy=true; const aiId='img'+Date.now(); const ca=document.getElementById('chat-area');
      const row=document.createElement('div'); row.className='msg-row ai'; row.id=aiId;
      row.innerHTML=`<div class="msg-in"><div class="msg-content"><img class="ai-av" src="icon.webp" alt=""/><div class="ai-body"><div class="ai-txt">
        <div class="activity-wrap" data-state="imaging">
          <div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div>
          <div class="activity-right"><div class="activity-label anim-dots">Generating Image</div><div class="activity-sub">${esc(prompt.slice(0,50))}${prompt.length>50?'...':''}</div></div>
        </div>
      </div></div></div></div>`;
      ca.appendChild(row); scrollBot();
      try{
        const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&model=flux&nologo=true`;
        await new Promise((res,rej)=>{const img=new Image();img.onload=res;img.onerror=rej;img.src=url;setTimeout(()=>rej(new Error('Timeout')),35000);});
        convo.msgs.push({role:'assistant',content:`Generated image for: *"${prompt}"*`,imageUrl:url,ts:Date.now(),truncated:false,modelKey:S.model});
      }catch(err){
        convo.msgs.push({role:'assistant',content:`Couldn't generate that image. ${err.message||'Try again.'}`,ts:Date.now(),truncated:false,modelKey:S.model});
      }
      document.getElementById(aiId)?.remove(); renderMsgs(); saveStore(); S.busy=false;
    }

    function stopGen(){ if(S.abort)S.abort.abort(); }

    function showErr(){
      const ca=document.getElementById('chat-area'); if(!ca)return;
      document.getElementById('err-row')?.remove();
      const r=document.createElement('div'); r.className='err-row'; r.id='err-row';
      r.innerHTML=`<div class="err-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#e06060;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span class="err-msg">Failed to get a response</span><button class="retry-btn" onclick="retryLast()">Retry</button></div>`;
      ca.appendChild(r); scrollBot();
    }
    function retryLast(){
      const c=curConvo(); if(!c||S.busy)return;
      document.getElementById('err-row')?.remove();
      const aiId='ai'+Date.now(); appendPending(aiId); generate(c,aiId,null,'',false);
    }

    /* ══════════════════════════════════════
       INPUT / SCROLL
    ══════════════════════════════════════ */
    function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
    function onKey(e){if(e.key==='Enter'&&!e.shiftKey&&!isMobile()){e.preventDefault();sendMsg();}}
    function isMobile(){return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||'ontouchstart'in window;}
    function scrollBot(smooth=false){const ca=document.getElementById('chat-area');if(!ca)return;ca.scrollTo({top:ca.scrollHeight,behavior:smooth?'smooth':'auto'});}

    /* ══════════════════════════════════════
       DIALOG
    ══════════════════════════════════════ */
    function showDialog(opts){
      document.getElementById('dialog-title').textContent=opts.title||'';
      document.getElementById('dialog-msg').textContent=opts.msg||'';
      const iw=document.getElementById('dialog-input-wrap'); const inp=document.getElementById('dialog-input');
      if(opts.input){iw.style.display='block';inp.value=opts.inputVal||'';inp.placeholder=opts.input;}else{iw.style.display='none';}
      const bts=document.getElementById('dialog-btns'); bts.innerHTML='';
      if(opts.cancel!==false){const cb=document.createElement('button');cb.className='dlg-btn cancel';cb.textContent=opts.cancelText||'Cancel';cb.onclick=closeDialog;bts.appendChild(cb);}
      const ok=document.createElement('button'); ok.className='dlg-btn '+(opts.danger?'danger':'confirm'); ok.textContent=opts.confirmText||'OK';
      ok.onclick=()=>{const v=inp?inp.value:'';closeDialog();if(opts.onConfirm)opts.onConfirm(v);}; bts.appendChild(ok);
      document.getElementById('dialog-ov').classList.add('show');
      if(opts.input){setTimeout(()=>inp?.focus(),100);if(inp)inp.onkeydown=e=>{if(e.key==='Enter')ok.click();};}
    }
    function closeDialog(){document.getElementById('dialog-ov').classList.remove('show');}
    function dlgConfirm(t,m,onY,d){showDialog({title:t,msg:m,onConfirm:onY,danger:d,confirmText:d?'Delete':'Confirm'});}

    /* ══════════════════════════════════════
       SETTINGS
    ══════════════════════════════════════ */
    function openSettings(){closeSidebar();renderSettings();document.getElementById('settings-ov').classList.add('show');}
    function closeSettings(){document.getElementById('settings-ov').classList.remove('show');}
    function renderSettings(){
      const body=document.getElementById('sheet-body'); if(!body)return;
      body.innerHTML=`
        <div class="sg"><div class="sg-lbl">Display</div>
          <div class="s-row"><div class="s-row-info"><div class="s-name">Show timestamps</div><div class="s-desc">Time under each message</div></div><div class="tog ${S.settings.timestamps?'on':''}" onclick="togSet('timestamps',this)"></div></div>
          <div class="s-row"><div class="s-row-info"><div class="s-name">Auto-scroll</div><div class="s-desc">Follow new messages</div></div><div class="tog ${S.settings.autoscroll?'on':''}" onclick="togSet('autoscroll',this)"></div></div>
        </div>
        <div class="sg"><div class="sg-lbl">Web Search</div>
          <div class="s-row"><div class="s-row-info"><div class="s-name">Smart auto-search</div><div class="s-desc">AI searches when uncertain or query needs live data</div></div><div class="tog ${S.settings.webSearchAuto?'on':''}" onclick="togSet('webSearchAuto',this)"></div></div>
        </div>
        <div class="sg"><div class="sg-lbl">Data</div>
          <div class="s-row"><div class="s-row-info"><div class="s-name">Save conversations</div><div class="s-desc">Keep history on device</div></div><div class="tog ${S.settings.save?'on':''}" onclick="togSet('save',this)"></div></div>
          <div class="s-row"><div class="s-row-info"><div class="s-name">Reset app</div><div class="s-desc">Wipe all data and reload</div></div><button class="s-btn" onclick="nukeAll()">Reset</button></div>
        </div>`;
    }
    function togSet(k,el){S.settings[k]=!S.settings[k];if(el)el.classList.toggle('on',S.settings[k]);saveStore();}
    function nukeAll(){dlgConfirm('Reset everything?','All data will be wiped.',()=>{try{localStorage.clear();}catch(e){}location.reload();},true);}

    /* ══════════════════════════════════════
       UTILS
    ══════════════════════════════════════ */
    function copyText(text,onDone){
      if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(onDone).catch(()=>fbCopy(text,onDone));}
      else fbCopy(text,onDone);
    }
    function fbCopy(text,onDone){
      try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(onDone)onDone();}
      catch(e){}
    }
    function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    </script>
  </body>
</html>
