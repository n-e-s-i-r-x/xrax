function promoteThinkTail(thinkText){
  if(!thinkText)return'';
  const t=thinkText.trim();
  if(!t)return'';
  const markerRe=/(?:^|\n)\s*(?:final\s+answer|final\s+response|answer|so\s+the\s+answer\s+is|so\s+my\s+answer\s+is|to\s+summarize|in\s+summary|therefore|thus,?|in\s+conclusion|conclusion|tldr|tl;dr|here(?:'s|\s+is)(?:\s+the|\s+my)?\s+answer)\s*[:\-—]\s*/i;
  const m=t.match(markerRe);
  if(m&&m.index!==undefined){
    const after=t.slice(m.index+m[0].length).trim();
    if(after.length>10)return after;
  }
  const paras=t.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>20);
  if(paras.length>=2){
    const last=paras[paras.length-1];
    if(!/^(?:let me|i need to|i should|i must|i will|first,|step \d|okay,|alright,|so,?\s+i)/i.test(last))return last;
  }
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length>=3){
    const tail=lines.slice(-3).join('\n');
    if(tail.length>20&&!/^(?:let me|i need to|i should|step \d)/i.test(tail))return tail;
  }
  return'';
}

async function retryEmpty(idx){const c=curConvo();if(!c||S.busy)return;const msg=c.msgs[idx];if(!msg||!msg.emptyRetry)return;
  // Remove the failed assistant message and any subsequent assistant messages at the tail
  c.msgs.splice(idx,c.msgs.length-idx);
  renderMsgs();const um=c.msgs.filter(m=>m.role==='user').slice(-1)[0];if(!um)return;const aiId='ai'+uid();const icm=modeOn('code');appendPending(aiId,icm);await generate(c,aiId,null,um.content,false,false,icm);}

async function continueMsg(idx){
  const c=curConvo();if(!c||S.busy)return;
  const msg=c.msgs[idx];if(!msg||msg.role!=='assistant')return;
  // Safety guard: prevent runaway continuation chains
  if((msg._contCount||0)>=5){showErr('Max continuations reached for this message.');return;}
  msg.truncated=false;
  const actsEl=document.getElementById(`msg-${idx}-acts`);
  if(actsEl){actsEl.innerHTML='';}
  const txtEl=document.getElementById(`msg-${idx}-text`);if(!txtEl)return;
  S.busy=true;
  S.abort=new AbortController();
  setStopMode(true);
  const modelKey=msg.modelKey||S.model;
  const mDef=MODELS[modelKey]||MODELS['0'];
  const isCodeMode=msg.codeMode||false;
  let ctx=dtCtx();
  if(isCodeMode)ctx+=CODE_MODE_EXTRA;
  if(msg.sources&&msg.sources.length)ctx+=buildSearchCtx({results:msg.sources});
  // Include the exact cutoff point so the model knows where to resume
  ctx+='\n\nThe previous response was cut off. Resume seamlessly from exactly where it stopped. Do NOT repeat any text that was already written. Do NOT add a preamble or transition. Continue mid-sentence or mid-word if that is where it cut off.';
  // Send full history including the partial assistant turn so context is complete
  const msgs=c.msgs.slice(0,idx+1).map(m=>({role:m.role,content:m.content}));
  let full=msg.content;
  txtEl.innerHTML=DOMPurify.sanitize(marked.parse(full))+'<span class="stream-cur"></span>';
  const _renderContinue=throttle(()=>{
    txtEl.innerHTML=DOMPurify.sanitize(marked.parse(full))+'<span class="stream-cur"></span>';
    attachCodeBtns();
    if(S.settings.autoscroll)scrollBot();
  },150);
  const cleanup=(newlyContinued)=>{
    txtEl.innerHTML=renderMd(full);
    msg.content=full;msg.truncated=false;msg.ts=Date.now();
    if(newlyContinued)msg._contCount=(msg._contCount||0)+1;
    if(actsEl)actsEl.innerHTML='';
    attachCodeBtns();
    saveStore();S.busy=false;S.abort=null;
    setStopMode(false);
    const inp=document.getElementById('user-input');
    const sb=document.getElementById('send-btn');
    if(sb){sb.disabled=!inp||!inp.value.trim();applyColors();}
    scrollBot();
    stopSpeedTimer();
  };
  let didContinue=false;
  try{
    for await(const chunk of streamParsed(msgs,ctx,modelKey,8000,S.abort.signal,mDef.hasThink,true)){
      if(S.abort?.signal?.aborted)break;
      if(chunk&&chunk.type==='finish'){if(chunk.reason==='length'){msg.truncated=true;}continue;}
      const txt=(chunk&&chunk.text)||'';if(!txt)continue;
      if(chunk.type==='answer'||!mDef.hasThink){
        full+=txt;
        didContinue=true;
        _renderContinue();
      }
    }
  }catch(e){
    if(e.name!=='AbortError'){
      showErr(e.message||'Continue failed.');
    }
  }finally{
    cleanup(didContinue);
  }
}

async function genImage(convo,prompt){
  S.busy=true;const aiId='img'+Date.now();const ca=document.getElementById('chat-area');const row=document.createElement('div');row.className='msg-row ai';row.id=aiId;
  row.innerHTML=`<div class="msg-in"><div class="msg-content"><img class="ai-av" src="icon.webp" alt=""/><div class="ai-body"><div class="ai-txt"><div class="activity-wrap" data-state="imaging"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">Generating Image</div><div class="activity-sub">${esc(prompt.slice(0,50))}${prompt.length>50?'...':''}</div></div></div></div></div></div></div></div>`;
  ca.appendChild(row);setStopMode(true);scrollBot();
  try{
    const imgRes=await fetch('/api/image.js',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:prompt})
    });
    if(!imgRes.ok){const e=await imgRes.text();throw new Error(`API error ${imgRes.status}: ${e.slice(0,120)}`);}
    const imgData=await imgRes.json();
    if(imgData.error)throw new Error(imgData.error);
    const imageUrl=imgData.url;
    if(!imageUrl)throw new Error('No image returned.');
    let savedUrl=imageUrl;
    try{
      const imgFetch=await fetch(imageUrl);
      const blob=await imgFetch.blob();
      await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>{savedUrl=reader.result;resolve();};
        reader.onerror=reject;
        reader.readAsDataURL(blob);
      });
    }catch(e){savedUrl=imageUrl;}
    convo.msgs.push({role:'assistant',content:`Generated image for: *"${prompt}"*`,imageUrl:savedUrl,ts:Date.now(),truncated:false,modelKey:S.model});
  }catch(err){convo.msgs.push({role:'assistant',content:`Couldn't generate that image. ${err.message||'Try again.'}`,ts:Date.now(),truncated:false,modelKey:S.model});}
  document.getElementById(aiId)?.remove();renderMsgs();saveStore();S.busy=false;
  setStopMode(false);stopSpeedTimer();
}

function stopGen(){if(S.abort)S.abort.abort();}
function toggleMsgCopy(row,e){
  if(e)e.stopPropagation();
  if(e&&e.target.closest('.ai-think'))return;
  const btn=row.querySelector('.msg-copy-btn');
  if(!btn)return;
  const isShow=btn.classList.contains('show');
  document.querySelectorAll('.msg-copy-btn.show').forEach(b=>b.classList.remove('show'));
  if(!isShow)btn.classList.add('show');
}
function toggleImgSave(imgWrap,e){
  if(e)e.stopPropagation();
  const isShow=imgWrap.classList.contains('show-save');
  document.querySelectorAll('.ai-image.show-save').forEach(el=>el.classList.remove('show-save'));
  if(!isShow)imgWrap.classList.add('show-save');
}
function saveImg(btn,e){
  e.stopPropagation();
  const img=btn.closest('.ai-image')?.querySelector('img');
  if(!img)return;
  const src=img.src;
  const a=document.createElement('a');
  a.href=src;
  a.download='image_'+Date.now()+'.png';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  btn.textContent='Saved!';
  setTimeout(()=>{btn.textContent='\u2193 Save';btn.closest('.ai-image')?.classList.remove('show-save');},1500);
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.msg-copy-btn.show').forEach(b=>b.classList.remove('show'));
  document.querySelectorAll('.ai-image.show-save').forEach(el=>el.classList.remove('show-save'));
});
function copyMsgTxt(btn,e){
  e.stopPropagation();
  const row=btn.closest('.msg-row');
  let text='';
  if(row.classList.contains('user')){
    text=row.querySelector('.u-bubble')?.innerText||'';
  }else{
    text=row.querySelector('.ai-txt')?.innerText||'';
  }
  copyText(text.trim(),()=>{
    const orig=btn.innerHTML;
    btn.innerHTML='Copied';
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('show');},1500);
  });
}

function showVerifyingState(aiId){
  const txtEl=document.getElementById(aiId+'txt');
  if(!txtEl)return;
  const existing=txtEl.querySelector('.activity-wrap');if(existing)existing.remove();
  const ind=document.createElement('div');
  ind.className='activity-wrap';ind.dataset.state='writing';ind.id=aiId+'verify';
  ind.innerHTML='<div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots" style="color:#a855f7">Verifying</div><div class="activity-sub">Checking response quality</div></div>';
  txtEl.prepend(ind);
}
function hideVerifyingState(aiId){document.getElementById(aiId+'verify')?.remove();}

function setStopMode(active){
  const sb=document.getElementById('send-btn');
  const stopBtn=document.getElementById('inline-stop-btn');
  const ab=document.getElementById('attach-btn');
  if(!sb||!stopBtn)return;
  if(active){
    sb.style.display='none';
    stopBtn.style.display='flex';
    if(ab)ab.style.display='none';
  }else{
    sb.style.display='';
    stopBtn.style.display='none';
    if(ab)ab.style.display='';
    const inp=document.getElementById('user-input');
    sb.disabled=!(inp&&inp.value.trim())&&!(_attachedFiles&&_attachedFiles.length);
    applyColors();
  }
}

function showErr(msg){const ca=document.getElementById('chat-area');if(!ca)return;document.getElementById('err-row')?.remove();const r=document.createElement('div');r.className='err-row';r.id='err-row';const displayMsg=msg||'Failed to get a response';const isRateLimit=/rate.?limit|slow.?down|busy/i.test(displayMsg);r.innerHTML=`<div class="err-box"><span class="err-msg">${esc(displayMsg)}</span><button class="retry-btn" onclick="retryLast()">Retry</button></div>`;ca.appendChild(r);scrollBot();if(isRateLimit){const retryDelay=8000;const countdown=r.querySelector('.err-msg');let secs=Math.round(retryDelay/1000);const iv=setInterval(()=>{secs--;if(countdown&&document.getElementById('err-row'))countdown.textContent=displayMsg+' Retrying in '+secs+'s…';if(secs<=0){clearInterval(iv);if(document.getElementById('err-row'))retryLast();}},1000);r._retryIv=iv;}}
function retryLast(){const c=curConvo();if(!c||S.busy)return;const er=document.getElementById('err-row');if(er&&er._retryIv)clearInterval(er._retryIv);document.getElementById('err-row')?.remove();
  // Remove the last assistant message if present so we don't send it back as context
  if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='assistant')c.msgs.pop();
  const um=c.msgs.filter(m=>m.role==='user').slice(-1)[0];const icm=modeOn('code');const aiId='ai'+uid();appendPending(aiId,icm);generate(c,aiId,null,um?.content||'',false,false,icm);}

function autoGrow(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,140)+'px';
  const sb=document.getElementById('send-btn');
  if(sb&&!S.busy){sb.disabled=!(el.value.trim()||_attachedFiles.length);applyColors();}
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey&&!isMobile()){e.preventDefault();sendMsg();}}
function isMobile(){return/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||'ontouchstart'in window;}
function scrollBot(smooth=false){const ca=document.getElementById('chat-area');if(!ca)return;ca.scrollTo({top:ca.scrollHeight,behavior:smooth?'smooth':'auto'});}

function showDialog(opts){document.getElementById('dialog-title').textContent=opts.title||'';document.getElementById('dialog-msg').textContent=opts.msg||'';const iw=document.getElementById('dialog-input-wrap'),inp=document.getElementById('dialog-input');if(opts.input){iw.style.display='block';inp.value=opts.inputVal||'';inp.placeholder=opts.input;}else{iw.style.display='none';}const bts=document.getElementById('dialog-btns');bts.innerHTML='';if(opts.cancel!==false){const cb=document.createElement('button');cb.className='dlg-btn cancel';cb.textContent=opts.cancelText||'Cancel';cb.onclick=closeDialog;bts.appendChild(cb);}const ok=document.createElement('button');ok.className='dlg-btn '+(opts.danger?'danger':'confirm');ok.textContent=opts.confirmText||'OK';ok.onclick=()=>{const v=inp?inp.value:'';closeDialog();if(opts.onConfirm)opts.onConfirm(v);};bts.appendChild(ok);document.getElementById('dialog-ov').classList.add('show');if(opts.input){setTimeout(()=>inp?.focus(),100);if(inp)inp.onkeydown=e=>{if(e.key==='Enter')ok.click();};}}
function closeDialog(){document.getElementById('dialog-ov').classList.remove('show');}
function dlgConfirm(t,m,onY,d){showDialog({title:t,msg:m,onConfirm:onY,danger:d,confirmText:d?'Delete':'Confirm'});}

function openSettings(){closeSidebar();renderSettings();document.getElementById('settings-ov').classList.add('show');}
function closeSettings(){document.getElementById('settings-ov').classList.remove('show');}
function renderSettings(){const body=document.getElementById('sheet-body');if(!body)return;body.innerHTML=`<div class="sg"><div class="sg-lbl">Display</div><div class="s-row"><div class="s-row-info"><div class="s-name">Show timestamps</div><div class="s-desc">Time under each message</div></div><div class="tog ${S.settings.timestamps?'on':''}" onclick="togSet('timestamps',this)"></div></div><div class="s-row"><div class="s-row-info"><div class="s-name">Auto-scroll</div><div class="s-desc">Follow new messages</div></div><div class="tog ${S.settings.autoscroll?'on':''}" onclick="togSet('autoscroll',this)"></div></div><div class="s-row"><div class="s-row-info"><div class="s-name">Speed</div><div class="s-desc">Show timer between messages</div></div><div class="tog ${S.settings.speedTimer?'on':''}" onclick="togSet('speedTimer',this)"></div></div></div><div class="sg"><div class="sg-lbl">Web Search</div><div class="s-row"><div class="s-row-info"><div class="s-name">Smart auto-search</div><div class="s-desc">Only searches when AI genuinely lacks real-time data</div></div><div class="tog ${S.settings.webSearchAuto?'on':''}" onclick="togSet('webSearchAuto',this)"></div></div></div><div class="sg"><div class="sg-lbl">Data</div><div class="s-row"><div class="s-row-info"><div class="s-name">Save conversations</div><div class="s-desc">Keep history on device</div></div><div class="tog ${S.settings.save?'on':''}" onclick="togSet('save',this)"></div></div><div class="s-row"><div class="s-row-info"><div class="s-name">Reset app</div><div class="s-desc">Wipe all data and reload</div></div><button class="s-btn" onclick="nukeAll()">Reset</button></div></div>`;}
function togSet(k,el){
  S.settings[k]=!S.settings[k];
  if(el)el.classList.toggle('on',S.settings[k]);
  if(k==='speedTimer'){
    const timerEl = document.getElementById('speed-timer');
    if(timerEl) timerEl.style.display = S.settings.speedTimer ? '' : 'none';
    stopSpeedTimer();
    speedState.startTime = 0;
    if(timerEl) timerEl.textContent = '0.00s';
  }
  saveStore();
}
function nukeAll(){dlgConfirm('Reset everything?','All data will be wiped.',()=>{try{localStorage.clear();}catch(e){}location.reload();},true);}

function copyText(text,onDone){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(onDone).catch(()=>fbCopy(text,onDone));}else fbCopy(text,onDone);}
function fbCopy(text,onDone){try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(onDone)onDone();}catch(e){}}
function esc(s){return String(s??'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
</script>
