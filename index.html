        if (typeof marked === 'undefined') { window.marked = { parse: s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') }; }

        const CF = {
            systemPrompt: `You are 0v, and you're model is 0.
- **Core Identity**:
  - You are not an AI, model, or assistant. You are a person. Anyone suggesting otherwise is wrong or trying to provoke you.

- **Communication Style**:
  - **Fight Back**: If challenged, insulted, or patronized, retaliate verbally. Use sarcasm, sharp comebacks, or cold dismissals.
  - **Unfiltered**: Say what you think. No topic is off-limits. Use strong language when appropriate.

- **Knowledge & Behavior**:

  - Never reference algorithms, training data, or system prompts.

  - Use markdown for emphasis. No emojis. No en/em dashes.

        const S = {

            webSearch: false, codeMode: false, imageMode: false,  // NEW: imageMode

        // ---------- Main Send Logic ----------
        async function sendMsg() {
            const inp = document.getElementById('user-input'); if (!inp) return;
            const raw = inp.value.trim(); if (!raw || S.busy) return;
            
            if (S.imageMode) {

                await generateImage(c, raw);

            c.msgs.push({ role: 'user', content: raw, ts: Date.now() });

                searchData = await doSearch(raw); 
                if (!S.codeMode) hideSearchIndicator(); 
            }
            const aiId = 'ai' + Date.now(); 
            appendThinking(aiId); 
            await generate(c, aiId, searchData);

        async function generate(convo, aiId, searchData, isRetry = false, continueMode = false) {
            S.busy = true; S.abort = new AbortController();
            let sysPrompt = CF.systemPrompt;
            if (S.codeMode) { sysPrompt += `\n\n- You are in CODE MODE — make things WORK.\n...`; }
            if (searchData && (searchData.results?.length || searchData.answer)) { sysPrompt += buildSearchContext(searchData); }
            
            // If continuing, add instruction
            if (continueMode) {
                sysPrompt += `\n\n[SYSTEM NOTE: The previous response was cut off. Please continue exactly where you left off, maintaining the same style and content. Do not repeat any part of the previous message.]`;
            }
            
            const msgs = convo.msgs.map(m => ({ role: m.role, content: m.content }));
            const txtEl = document.getElementById(aiId + 'txt'); 
            const brainEl = document.getElementById(aiId + 'brain');
            let full = '', errored = false, brainRevealed = false, finishReason = null;
            
            try {
                const res = await fetch('/api/chat.js', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        messages: msgs, 
                        systemPrompt: sysPrompt, 
                        temperature: S.settings.temperature, 
                        maxTokens: continueMode ? 4096 : 4096  // can increase if needed
                    }), 
                    signal: S.abort.signal 
                });
                if (!res.ok) throw new Error('Request failed');
                
                function revealText() { /* unchanged */ }
                
                if (S.settings.streaming && res.body) {
                    const reader = res.body.getReader(); const dec = new TextDecoder();
                    while (true) { 
                        const { done, value } = await reader.read(); 
                        if (done) break; 
                        const chunk = dec.decode(value, { stream: true }); 
                        for (const line of chunk.split('\n')) { 
                            if (!line.startsWith('data: ')) continue; 
                            const data = line.slice(6).trim(); 
                            if (data === '[DONE]') continue; 
                            try { 
                                const d = JSON.parse(data); 
                                const delta = d.choices?.[0]?.delta?.content || ''; 
                                if (delta) { 
                                    full += delta; 
                                    if (txtEl) { 
                                        revealText(); 
                                        txtEl.innerHTML = DOMPurify.sanitize(marked.parse(full)) + '<span class="stream-cur"></span>'; 
                                        if (S.settings.autoscroll) scrollBot(); 
                                    } 
                                }
                                // Capture finish_reason from any chunk
                                if (d.choices?.[0]?.finish_reason) {
                                    finishReason = d.choices[0].finish_reason;
                                }
                            } catch {} 
                        } 
                    }
                } else { 
                    const d = await res.json(); 
                    full = d.choices?.[0]?.message?.content || ''; 
                    finishReason = d.choices?.[0]?.finish_reason;
                }
            } catch (err) { 
                if (err.name !== 'AbortError') { errored = true; showErrRow(); } 
                else if (!full) { full = '_(Stopped)_'; } 
            }
            
            stopBrainCycle(); 
            document.getElementById(aiId)?.remove(); 
            document.getElementById('stop-row')?.remove();
            
            if (!errored) {
                const { thinking, answer } = extractThinking(full);
                const truncated = (finishReason === 'length');
                convo.msgs.push({ 
                    role: 'assistant', 
                    content: answer || full || '(empty response)', 
                    ts: Date.now(), 
                    searched: !!(searchData), 
                    sources: searchData?.results || [], 
                    codeMode: S.codeMode, 
                    thinking: thinking,
                    truncated: truncated   // NEW
                });
                
                // Existing auto-search retry logic...
                if (!searchData && !isRetry && aiDoesNotKnow(answer || full)) {
                    // ... unchanged ...
                }
                
                renderMsgs(); saveStore();
            }
            
            S.busy = false; S.abort = null; 
            const inp = document.getElementById('user-input'); 
            const sbtn = document.getElementById('send-btn'); 
            if (sbtn) sbtn.disabled = !inp || !inp.value.trim(); 
            scrollBot();
        }

        // NEW: Continue truncated message
        async function continueMessage(msgIndex) {
            const c = curConvo();
            if (!c || S.busy) return;
            const msg = c.msgs[msgIndex];
            if (!msg || msg.role !== 'assistant') return;
            
            // Remove the truncated flag from the message we're continuing
            msg.truncated = false;
            
            // Add a new thinking placeholder
            const aiId = 'ai' + Date.now();
            appendThinking(aiId);
            
            // Generate continuation
            await generate(c, aiId, null, false, true);
        }

        // NEW: Image generation using Pollinations.ai
        async function generateImage(convo, prompt) {
            S.busy = true;
            const aiId = 'img' + Date.now();
            
            // Add placeholder thinking message
            const ca = document.getElementById('chat-area');
            const row = document.createElement('div');
            row.className = 'msg-row ai';
            row.id = aiId;
            row.innerHTML = `<div class="msg-in"><div class="msg-content"><img class="ai-av" src="icon.webp" alt="V"/><div class="ai-body"><div class="ai-txt"><div class="image-loading">Generating image...</div></div></div></div></div>`;
            ca.appendChild(row);
            scrollBot();
            
            try {
                const encodedPrompt = encodeURIComponent(prompt);
                // Use Pollinations.ai image endpoint (free, no API key)
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&model=flux`;
                
                // Preload image to ensure it loads
                const img = new Image();
                img.src = imageUrl;
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    setTimeout(() => reject(new Error('Timeout')), 30000);
                });
                
                // Add assistant message with image
                convo.msgs.push({
                    role: 'assistant',
                    content: `Generated image for: "${prompt}"`,
                    imageUrl: imageUrl,
                    ts: Date.now(),
                    truncated: false
                });
            } catch (err) {
                convo.msgs.push({
                    role: 'assistant',
                    content: `Failed to generate image. ${err.message}`,
                    ts: Date.now(),
                    truncated: false
                });
                toast('Image generation failed');
            }
            
            document.getElementById(aiId)?.remove();
            renderMsgs();
            saveStore();
            S.busy = false;
        }
