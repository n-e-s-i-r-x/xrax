<html lang="en">

<style>
@font-face{font-family:"M";src:url("M.ttf")format("truetype");}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:"M",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased;font-size:16px;overscroll-behavior:none;}
button,input,textarea{font-family:"M";font-size:16px;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,textarea{outline:none;border:none;background:none;}
::-webkit-scrollbar{width:0;height:0;}

#intro{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 1s ease;}
#intro.hide{opacity:0;pointer-events:none;}
#intro-logo{width:72px;height:72px;object-fit:contain;animation:introPop 3s cubic-bezier(0.34,1.56,0.64,1) forwards;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;}
@keyframes introPop{0%{opacity:0;transform:scale(0.6)}100%{opacity:1;transform:scale(1)}}
#intro-pulse{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.05);animation:iPulse 1.5s ease-out infinite;}
@keyframes iPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.5);opacity:0}}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;opacity:0;transition:opacity 0.4s ease;}
#app.ready{opacity:1;}

#topbar{flex-shrink:0;display:flex;align-items:center;padding:0 12px;gap:10px;background:#000;border-bottom:1px solid #141414;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));}
.tb-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#888;flex-shrink:0;transition:background .15s,color .15s,transform .1s;}
.tb-btn:active{background:#141414;color:#fff;transform:scale(.92);}
.tb-center{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
.tb-title{font-size:15px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

#chat-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
#chat-area{flex:1;overflow-y:auto;padding:16px 0 8px;-webkit-overflow-scrolling:touch;}

#empty-state{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:14px;animation:fadeUp .5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#empty-logo{width:60px;height:60px;object-fit:contain;opacity:.5;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;}
#empty-h{font-size:22px;font-weight:700;color:#ddd;text-align:center;}
#empty-s{font-size:14px;color:#555;text-align:center;max-width:300px;line-height:1.5;}

.msg-row{padding:4px 0;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg-row.user .msg-in{padding:0 14px;display:flex;flex-direction:column;align-items:flex-end;}
.u-bubble{background:#1a1a1a;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;font-size:15px;line-height:1.5;color:#fff;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;}

.msg-row.ai .msg-in{padding:0 14px;}
.msg-row.ai .msg-content{display:flex;gap:10px;align-items:flex-start;}
.ai-av{width:28px;height:28px;object-fit:contain;flex-shrink:0;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important;}
.ai-body{flex:1;min-width:0;}
.ai-txt{font-size:15px;line-height:1.6;color:#ddd;word-wrap:break-word;overflow-wrap:break-word;}
.ai-txt h1,.ai-txt h2,.ai-txt h3{color:#fff;margin:12px 0 6px;font-weight:600;}
.ai-txt h1{font-size:20px}.ai-txt h2{font-size:17px}.ai-txt h3{font-size:15px}
.ai-txt p{margin:0 0 8px}.ai-txt p:last-child{margin:0}
.ai-txt ul,.ai-txt ol{margin:6px 0 8px 20px}.ai-txt li{margin:3px 0}
.ai-txt strong{color:#fff;font-weight:600}
.ai-txt a{color:#4a9eff;text-decoration:underline}
.ai-txt blockquote{border-left:3px solid #2a2a2a;padding:4px 12px;color:#888;margin:8px 0}
.ai-txt code:not(pre code){background:#1a1a1a;border-radius:4px;padding:2px 6px;font-family:"M",Menlo,monospace;font-size:13px;color:#ddd}

.activity-wrap{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.activity-orb{width:28px;height:28px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.activity-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;animation:orbSpin 1.8s linear infinite}
.activity-orb-dot{width:6px;height:6px;border-radius:50%;position:relative;z-index:1}
.activity-wrap[data-state="thinking"] .activity-orb-ring{border-top-color:#a855f7;border-right-color:rgba(168,85,247,.4)}
.activity-wrap[data-state="thinking"] .activity-orb-dot{background:#a855f7}
.activity-wrap[data-state="writing"] .activity-orb-ring{border-top-color:#ddd;border-right-color:rgba(221,221,221,.4)}
.activity-wrap[data-state="writing"] .activity-orb-dot{background:#bbb}
.activity-wrap[data-state="coding"] .activity-orb-ring{border-top-color:#4ade80;border-right-color:rgba(74,222,128,.4)}
.activity-wrap[data-state="coding"] .activity-orb-dot{background:#4ade80}
.activity-wrap[data-state="searching"] .activity-orb-ring{border-top-color:#4a9eff;border-right-color:rgba(74,158,255,.4)}
.activity-wrap[data-state="searching"] .activity-orb-dot{background:#4a9eff}
.activity-wrap[data-state="imaging"] .activity-orb-ring{border-top-color:#fbbf24;border-right-color:rgba(251,191,36,.4)}
.activity-wrap[data-state="imaging"] .activity-orb-dot{background:#fbbf24}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.activity-right{display:flex;flex-direction:column;gap:3px;min-width:0}
.activity-label{font-size:12px;font-weight:600;letter-spacing:.2px}
.activity-wrap[data-state="thinking"] .activity-label{color:#c084fc}
.activity-wrap[data-state="writing"] .activity-label{color:#bbb}
.activity-wrap[data-state="coding"] .activity-label{color:#4ade80}
.activity-wrap[data-state="searching"] .activity-label{color:#4a9eff}
.activity-wrap[data-state="imaging"] .activity-label{color:#fbbf24}
.activity-sub{font-size:11px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;font-style:italic}
.anim-dots::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

.ai-think{margin-bottom:10px;border:1px solid #1e1530;border-radius:12px;overflow:hidden;background:#080810}
.ai-think-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#0d0b14;cursor:pointer;user-select:none}
.ai-think-hdr:active{background:#120f1c}
.ai-think-chev{transition:transform .25s ease;color:#c084fc;flex-shrink:0}
.ai-think.open .ai-think-chev{transform:rotate(90deg)}
.ai-think-lbl{font-size:12px;font-weight:600;color:#c084fc;letter-spacing:.3px;flex:1}
.ai-think.streaming .ai-think-lbl::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
.ai-think-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.ai-think.open .ai-think-body{max-height:600px;overflow-y:auto}
.ai-think-content{padding:10px 12px 12px;font-size:12.5px;line-height:1.75;color:#7a6aaa;border-top:1px solid #1e1530;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap}

.think-srch-pill{display:flex;align-items:center;gap:7px;background:#060f1c;border:1px solid #0e2035;border-radius:8px;padding:6px 11px;margin:6px 0;font-size:11px;color:#4a9eff;font-style:normal;width:fit-content}
.think-srch-dot{width:3px;height:3px;border-radius:50%;background:#4a9eff;animation:tsd 1.1s ease-in-out infinite;flex-shrink:0}
.think-srch-dot:nth-child(2){animation-delay:.18s}
.think-srch-dot:nth-child(3){animation-delay:.36s}
@keyframes tsd{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.think-srch-done{display:flex;align-items:center;gap:7px;background:#030d03;border:1px solid #0e2010;border-radius:8px;padding:6px 11px;margin:6px 0;font-size:11px;color:#4ade80;font-style:normal;width:fit-content}

.answer-waiting{display:flex;align-items:center;gap:8px;padding:6px 0 2px;opacity:.5}
.answer-waiting-dots{display:flex;gap:4px}
.answer-waiting-dots span{width:4px;height:4px;border-radius:50%;background:#555;animation:awDot 1.4s ease-in-out infinite}
.answer-waiting-dots span:nth-child(2){animation-delay:.2s}
.answer-waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes awDot{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.answer-waiting-lbl{font-size:11px;color:#555;font-style:italic}

.code-wrap{margin:10px 0;border-radius:10px;overflow:hidden;background:#0a0a0a;border:1px solid #1a1a1a}
.code-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#111;border-bottom:1px solid #1a1a1a}
.code-lang{font-size:11px;color:#666}
.code-hdr-btns{display:flex;gap:5px;align-items:center}
.copy-code,.dl-btn,.view-btn{padding:4px 10px;background:#1a1a1a;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .15s;border:none}
.copy-code{color:#aaa}.copy-code:active{background:#252525}
.dl-btn{color:#4a9eff}.dl-btn:active{background:#252525}
.view-btn{color:#4ade80}.view-btn:active{background:#252525}
.ai-txt pre{padding:12px;overflow-x:auto;margin:0;background:#0a0a0a}
.ai-txt pre code{background:none;padding:0;font-family:"M",Menlo,monospace;font-size:13px;color:#ccc;line-height:1.5}

.msg-acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ma-btn{padding:5px 10px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;color:#888;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .15s,transform .1s}
.ma-btn:active{background:#1a1a1a;transform:scale(.94)}
.msg-ts{font-size:10px;color:#444;margin-top:4px}
.web-badge{display:inline-flex;align-items:center;gap:5px;background:#0a1628;border:1px solid #1a3050;border-radius:6px;padding:3px 8px;font-size:11px;color:#4a9eff;margin-bottom:8px}
.sources-wrap{margin-top:10px;border-top:1px solid #141414;padding-top:8px}
.sources-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#444;cursor:pointer;user-select:none;padding:2px 0 6px;background:none;border:none;transition:color .15s}
.sources-toggle:active{color:#888}
.sources-chev{transition:transform .28s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.sources-wrap.open .sources-chev{transform:rotate(90deg)}
.sources-list{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease;opacity:0}
.sources-wrap.open .sources-list{max-height:600px;opacity:1}
.source-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;text-decoration:none}
.source-favicon{width:14px;height:14px;border-radius:3px;flex-shrink:0;margin-top:2px;object-fit:contain}
.source-text{flex:1;min-width:0}
.source-name{font-size:12px;color:#4a9eff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-decoration:underline}
.source-url{font-size:10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

#input-area{flex-shrink:0;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #141414}
.input-box{background:#0a0a0a;border:2px solid #1e1e1e;border-radius:18px;display:flex;flex-direction:column;transition:border-color .2s;overflow:hidden}
.input-tools{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0}
.input-tools::-webkit-scrollbar{display:none}
.input-row{display:flex;align-items:flex-end;padding:4px 6px 6px 8px;gap:6px}
#user-input{flex:1;color:#fff;font-size:15px;line-height:1.4;resize:none;max-height:140px;min-height:32px;padding:7px 4px;overflow-y:auto;background:transparent}
#user-input::placeholder{color:#444}
.send-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s,box-shadow .15s;border:none}
.send-btn:active{transform:scale(.9)}

.model-btn{height:30px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;transition:border-color .2s,color .2s,box-shadow .2s,transform .1s;font-size:12px;font-weight:700;letter-spacing:.5px;white-space:nowrap;border-width:2px;border-style:solid;}
.model-btn:active{transform:scale(.9)}

.mode-btn{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:12px;border-width:2px;border-style:solid;background:transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
.mode-btn svg{flex-shrink:0}

#mp-popup{position:fixed;z-index:9998;background:#0d0d0d;border:1px solid #222;border-radius:16px;padding:6px;width:260px;box-shadow:0 16px 48px rgba(0,0,0,.9);display:none;pointer-events:auto}
#mp-popup.open{display:block;animation:mpPop .15s cubic-bezier(.34,1.56,.64,1)}
@keyframes mpPop{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
#mp-overlay{position:fixed;inset:0;z-index:9997;display:none;background:transparent}
#mp-overlay.open{display:block}
.mp-head{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;padding:6px 10px 8px}
.mp-item{padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;margin-bottom:2px}
.mp-item:last-child{margin-bottom:0}
.mp-item:active{opacity:.8}
.mp-item.sel{border-color:#2a2a2a;background:#141414}
.mp-label-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.mp-name{font-size:13px;font-weight:700;color:#ddd}
.mp-item.sel .mp-name{color:#fff}
.mp-badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:99px;display:inline-flex;align-items:center}
.mp-badge.fast{color:#4a9eff;border:1px solid #1a3050}
.mp-badge.rapid{color:#ef4444;border:1px solid #3a1010}
.mp-desc{font-size:11px;color:#555;line-height:1.3}
.mp-item.sel .mp-desc{color:#777}

#image-notice{display:none;text-align:center;font-size:10.5px;color:#ffe066;padding:6px 14px 0;line-height:1.5}
#image-notice.show{display:block}
.stream-cur{display:inline-block;width:2px;height:15px;background:#666;margin-left:2px;vertical-align:text-bottom;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#stop-row{display:flex;justify-content:center;padding:10px 0}
.stop-btn{padding:9px 18px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:99px;color:#ddd;font-size:13px;display:flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
.stop-btn:active{background:#252525;transform:scale(.96)}
.err-row{padding:0 14px;margin:6px 0}
.err-box{background:#1a0a0a;border:1px solid #3a1515;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.err-msg{flex:1;font-size:13px;color:#cc8080}
.retry-btn{padding:6px 12px;background:#2a1010;border:1px solid #3a1515;border-radius:7px;color:#e0a0a0;font-size:12px}
#scroll-btn{position:absolute;bottom:14px;right:14px;width:40px;height:40px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ddd;opacity:0;pointer-events:none;transform:translateY(12px) scale(.85);transition:opacity .25s,transform .25s;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#scroll-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
#scroll-btn:active{transform:scale(.9)}

#sidebar-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
#sidebar-ov.show{opacity:1;pointer-events:auto}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:320px;background:#0a0a0a;border-right:1px solid #1a1a1a;z-index:100;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-head{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #141414}
.sb-logo{width:36px;height:36px;object-fit:contain;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:0!important;flex-shrink:0}
.sb-new{margin:12px;padding:12px 16px;background:#fff;color:#000;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.sb-new:active{transform:scale(.97)}
.sb-search{margin:0 12px 8px;padding:10px 12px;background:#141414;border-radius:10px;display:flex;align-items:center;gap:8px}
.sb-search svg{color:#555;flex-shrink:0}
.sb-search input{flex:1;color:#ddd;font-size:14px;min-width:0}
.sb-search input::placeholder{color:#444}
.sb-lbl{padding:10px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#444}
.chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-item{padding:12px;border-radius:10px;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:background .15s;cursor:pointer}
.chat-item:active{background:#141414}
.chat-item.active{background:#1a1a1a}
.chat-item svg{color:#555;flex-shrink:0}
.chat-item-txt{flex:1;font-size:14px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-del{padding:6px;color:#444;border-radius:6px;display:flex;align-items:center;transition:background .15s,color .15s}

.sb-foot{padding:8px;border-top:1px solid #141414;display:flex;flex-direction:column;gap:2px}

.sb-fbtn:active{background:#141414}
.sb-fbtn.danger{color:#cc6666}
.sb-fbtn.danger:active{background:#1a0808}

#dialog-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}

#dialog-box{background:#141414;border:1px solid #252525;border-radius:18px;padding:22px 20px 16px;width:100%;max-width:340px;animation:dialogIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes dialogIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
#dialog-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:6px}
#dialog-msg{font-size:14px;color:#888;line-height:1.5;margin-bottom:16px}
#dialog-input-wrap{margin-bottom:16px}

#dialog-btns{display:flex;gap:8px}
.dlg-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;transition:transform .1s,background .15s}
.dlg-btn:active{transform:scale(.96)}
.dlg-btn.cancel{background:#1a1a1a;color:#aaa}.dlg-btn.cancel:active{background:#252525}
.dlg-btn.confirm{background:#fff;color:#000}.dlg-btn.confirm:active{background:#ddd}
.dlg-btn.danger{background:#2a1010;color:#e06060}.dlg-btn.danger:active{background:#3a1515}

#settings-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center}
#settings-ov.show{display:flex}
#settings-sheet{background:#0a0a0a;border-radius:20px 20px 0 0;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:sheetUp .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:#333;border-radius:2px;margin:10px auto 6px;flex-shrink:0}
.sheet-head{padding:8px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #141414;flex-shrink:0}
.sheet-title{font-size:17px;font-weight:700;color:#fff}
.sheet-x{width:32px;height:32px;border-radius:50%;background:#141414;color:#888;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sheet-x:active{background:#252525}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.sg{margin-bottom:22px}
.sg-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:10px}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #141414;gap:12px}
.s-row:last-child{border-bottom:none}
.s-row-info{flex:1;min-width:0}
.s-name{font-size:14px;color:#ddd}
.s-desc{font-size:12px;color:#555;margin-top:2px}
.tog{width:48px;height:28px;background:#2a2a2a;border-radius:99px;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
.tog.on{background:#4ade80}
.tog::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tog.on::after{transform:translateX(20px)}
.s-btn{padding:8px 14px;background:#2a1010;border:1px solid #3a1515;border-radius:8px;color:#e06060;font-size:13px;font-weight:600;transition:background .15s,transform .1s;cursor:pointer}
.s-btn:active{background:#3a1515;transform:scale(.96)}

#view-ov{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column}
#view-ov.show{display:flex}
.view-topbar{flex-shrink:0;display:flex;align-items:center;padding:0 12px;gap:10px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;padding-top:env(safe-area-inset-top);height:calc(50px + env(safe-area-inset-top))}
.view-title{flex:1;font-size:14px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-close{width:36px;height:36px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#aaa;transition:background .15s;cursor:pointer}
.view-close:active{background:#252525}
.view-frame-wrap{flex:1;overflow:hidden;background:#fff}
.view-frame-wrap iframe{width:100%;height:100%;border:none}
.ai-image{margin:12px 0;border-radius:12px;overflow:hidden;max-width:100%;border:1px solid #1a1a1a}
.ai-image img{width:100%;height:auto;display:block}
.continue-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#4a9eff}
.continue-btn:active{background:#252525}
</style>
</head>

<script>
"use strict";
if(typeof marked==="undefined")window.marked={parse:s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")};
if(typeof DOMPurify==="undefined")window.DOMPurify={sanitize:s=>s};

const MODELS={
  '0'  :{key:'0',  label:'0',  placeholder:'Message 0...',  hasThink:false,temp:0.5},
  '00' :{key:'00', label:'00', placeholder:'Message 00...', hasThink:false, temp:0.1},
  '000':{key:'000',label:'000',placeholder:'Message 000...',hasThink:true, temp:0.6},
};
const BASE_DESCS={'0':'Balanced. No thinking.','00':'Fast. No thinking.','000':'Smartest. Thinking.'};

/* ══════════════════════════════════════
   COLOR SYSTEM
   Model 0  → mode-driven: default grey | search blue | code green | image yellow
   Model 00 → always blue  (overrides mode)
   Model 000→ always red   (overrides mode)
   All colors are ALWAYS bright — no dimming
══════════════════════════════════════ */
const C={
  grey:  {border:'#444',    text:'#aaa',   glow:'none', bg:'#1a1a1a', bgFocus:'#333',   send:'#fff',   sendTxt:'#000', sendDis:'#333',  sendDisTxt:'#888', modeBorder:'#333',  modeText:'#aaa',  modeBg:'#111'},
  green: {border:'#4ade80', text:'#4ade80', glow:'none', bg:'#0d2010', bgFocus:'#4ade80',send:'#4ade80',sendTxt:'#000', sendDis:'#1a3520',sendDisTxt:'#3a8a5a',modeBorder:'#4ade80',modeText:'#4ade80',modeBg:'#0a1a0e'},
  blue:  {border:'#4a9eff', text:'#4a9eff', glow:'none', bg:'#0a1a2e', bgFocus:'#4a9eff',send:'#4a9eff',sendTxt:'#000', sendDis:'#0a1a3a',sendDisTxt:'#2a5a8a',modeBorder:'#4a9eff',modeText:'#4a9eff',modeBg:'#060f1c'},
  yellow:{border:'#fbbf24', text:'#fbbf24', glow:'none', bg:'#1e1600', bgFocus:'#fbbf24',send:'#fbbf24',sendTxt:'#000', sendDis:'#2a1e00',sendDisTxt:'#8a7020',modeBorder:'#fbbf24',modeText:'#fbbf24',modeBg:'#130f00'},
  red:   {border:'#ef4444', text:'#ef4444', glow:'none', bg:'#1e0808', bgFocus:'#ef4444',send:'#ef4444',sendTxt:'#fff', sendDis:'#2a0a0a',sendDisTxt:'#8a3030',modeBorder:'#ef4444',modeText:'#ef4444',modeBg:'#100404'},
};

function resolveColor(){
  if(S.model==='00')  return C.blue;
  if(S.model==='000') return C.red;
  if(modeOn('code'))  return C.green;
  if(modeOn('web'))   return C.blue;
  if(modeOn('image')) return C.yellow;
  return C.grey;
}

function applyColors(){
  const c=resolveColor();
  // Model button
  const mb=document.getElementById('model-btn');
  if(mb){mb.style.borderColor=c.border;mb.style.color=c.text;mb.style.boxShadow=c.glow;}
  // Input box border
  const box=document.getElementById('input-box');
  if(box){box.style.borderColor=c.border;box.style.boxShadow=c.glow;}
  // Send button
  const sb=document.getElementById('send-btn');
  if(sb){
    if(!sb.disabled){sb.style.background=c.send;sb.style.color=c.sendTxt;sb.style.boxShadow=c.glow;}
    else{sb.style.background=c.sendDis;sb.style.color=c.sendDisTxt;sb.style.boxShadow='none';}
  }
  // Mode buttons
  applyModeButtons(c);
}

function applyModeButtons(c){
  // Search btn
  const wb=document.getElementById('web-btn');
  if(wb){
    if(modeOn('web')){wb.style.borderColor=C.blue.modeBorder;wb.style.color=C.blue.modeText;wb.style.background=C.blue.modeBg;}
    else{wb.style.borderColor='#2a2a2a';wb.style.color='#555';wb.style.background='transparent';}
  }
  // Code btn
  const cb=document.getElementById('code-btn');
  if(cb){
    if(modeOn('code')){cb.style.borderColor=C.green.modeBorder;cb.style.color=C.green.modeText;cb.style.background=C.green.modeBg;}
    else{cb.style.borderColor='#2a2a2a';cb.style.color='#555';cb.style.background='transparent';}
  }
  // Image btn
  const ib=document.getElementById('image-btn');
  if(ib){
    if(modeOn('image')){ib.style.borderColor=C.yellow.modeBorder;ib.style.color=C.yellow.modeText;ib.style.background=C.yellow.modeBg;}
    else{ib.style.borderColor='#2a2a2a';ib.style.color='#555';ib.style.background='transparent';}
  }
}

/* ─── LEAK SANITIZER ─── */
const LEAK_LINE_RE=[/^\s*\[[A-Z][^\]]{2,120}\]\s*$/,/---\s*WEB SEARCH RESULTS\s*---/i,/---\s*END SEARCH RESULTS\s*---/i,/\bDIRECT\s*ANSWER\s*:/i,/\[CODE MODE\b/i,/\[Current date and time\]/i,/\[Reasoning context above/i,/\[Continue from where/i,/\[Search complete/i,/<context>|<\/context>/i,/\bYou are (?:0|00|000)\b/,/\bsystem prompt\b/i,/\b(?:my|the) (?:instructions?|rules|role|configuration|behavior list)\b/i];
function sanitizeThinkText(t){if(!t)return t;return t.split('\n').map(l=>{for(const r of LEAK_LINE_RE)if(r.test(l))return'…';return l;}).join('\n');}

/* ─── UNCERTAINTY ─── */
const UNCERTAINTY_HARD=[/\b(don'?t|do not|doesn'?t|does not)\s+have\s+(access|real.?time|live|current|up.?to.?date)\b/i,/\b(can'?t|cannot|could not|couldn'?t)\s+(access|find|retrieve|fetch|get)\s+(real.?time|live|current|up.?to.?date|today'?s?|latest)\b/i,/\bmy\s+(knowledge|training|data)\s+(cut.?off|ends?|stops?|is\s+limited\s+to|is\s+from)\b/i,/\b(as\s+of\s+my\s+(last|knowledge)\s+update|my\s+knowledge\s+(only\s+goes?|extends?)\s+to)\b/i,/\b(this\s+(information\s+)?(may|might|could)\s+(be\s+)?(outdated|have\s+changed|no\s+longer\s+be\s+accurate))\b/i,/\b(i\s+(don'?t|do\s+not)\s+know\s+the\s+(current|latest|today'?s?|real.?time|live))\b/i,/\b(for\s+the\s+most\s+(up.?to.?date|current|accurate|recent)\s+(information|data|details),?\s+(please\s+)?(check|visit|refer|look))\b/i,/\b(i\s+(genuinely\s+)?(don'?t|do\s+not)\s+know|i\s+have\s+no\s+(idea|information|data)\s+(about|on|regarding))\b/i,/\b(unable\s+to\s+(provide|give|access)\s+(current|live|real.?time|today'?s?))\b/i,/\b(you'?d?\s+(need|should|would\s+need)\s+to\s+(check|verify|look\s+up)\s+(the\s+)?(current|latest|live|real.?time))\b/i];
const UNCERTAINTY_NEVER=[/\b(i\s+know|i\s+am\s+sure|i\s+am\s+certain|the\s+answer\s+is|this\s+is\s+definitely)\b/i,/\b(here'?s?\s+(the\s+)?(code|solution|answer|implementation|example|fix))\b/i,/\b(let\s+me\s+(explain|show|walk\s+you|help\s+you|write|create|build))\b/i,/```/];
function detectUncertainty(text){if(!text||text.length<60)return false;const w=text.slice(-800);if(UNCERTAINTY_NEVER.some(r=>r.test(w)))return false;return UNCERTAINTY_HARD.some(r=>r.test(w));}

const USER_SEARCH_EXPLICIT=[/\b(weather|forecast)\s+(in|for|today|tomorrow|right\s+now)\b/i,/\b(live|real.?time)\s+(score|result|price|rate|stock|exchange|update)\b/i,/\b(breaking\s+news|latest\s+news|recent\s+news|today'?s?\s+news)\b/i,/\bwhat'?s?\s+(the\s+)?(current|today'?s?|live|right\s+now)\s+(price|weather|score|news|status)\b/i,/\b(price\s+of|how\s+much\s+is)\s+(bitcoin|btc|eth|ethereum)\s+(now|today|currently|right\s+now)\b/i,/\b(who\s+won|final\s+score|match\s+result)\s+.{0,30}(today|tonight|yesterday|this\s+week)\b/i,/\bcurrent\s+(time|date)\s+in\b/i];
const USER_SEARCH_SKIP=[/^(hi|hello|hey|thanks?|ok|bye|yes|no|sure|lol|hm+|um+)[\s!.?]*$/i,/\b(how\s+(do|to)|what\s+is|explain|why|define|difference\s+between|compare|what\s+are)\b/i,/\b(write|create|make|generate|help\s+me|give\s+me|list|show|build|code|design)\b/i,/\b(math|calculate|solve|equation|formula|algorithm|function|class|component)\b/i,/\b(who\s+(is|was)|history\s+of|founded|invented|created|born|died)\b/i,/\b(how\s+does|what\s+does|meaning\s+of|definition\s+of)\b/i];
function queryNeedsSearch(text){if(modeOn('web'))return true;if(modeOn('image')||!text)return false;if(!S.settings.webSearchAuto)return false;const t=text.trim();if(t.length<8)return false;if(USER_SEARCH_SKIP.some(r=>r.test(t)))return false;return USER_SEARCH_EXPLICIT.some(r=>r.test(t));}
async function doSearch(q){try{const r=await fetch('/api/search.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});if(!r.ok)return null;const d=await r.json();return(d.results?.length||d.answer)?d:null;}catch(e){return null;}}

function buildMsg(msg,idx){
  const ts=S.settings.timestamps&&msg.ts?`<div class="msg-ts">${new Date(msg.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`:'';

  const cma=msg.codeMode?'data-codemode="true"':'';
  const badge=msg.userSearched?`<div class="web-badge"><svg width="10" height="10" viewBox="0 0 6 6" fill="currentColor" shape-rendering="crispEdges"><rect x="2" y="0" width="2" height="1"/><rect x="1" y="1" width="4" height="1"/><rect x="0" y="2" width="6" height="1"/><rect x="1" y="3" width="4" height="1"/><rect x="0" y="3" width="1" height="2"/><rect x="5" y="3" width="1" height="2"/><rect x="1" y="5" width="4" height="1"/></svg>Searched the web</div>`:'';
  let thinkHtml='';
  if(msg.thinking&&msg.thinking.trim()){
    const dur=msg.thinkDuration?`Thought for ${msg.thinkDuration}s`:'Thought';
    thinkHtml=`<div class="ai-think" onclick="this.classList.toggle('open')">
      <div class="ai-think-hdr">
        <svg class="ai-think-chev" width="10" height="10" viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges"><rect x="1" y="1" width="1" height="3"/><rect x="2" y="0" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="1" width="1" height="3"/><rect x="4" y="2" width="1" height="1"/></svg>
        <span class="ai-think-lbl">${esc(dur)}</span>

      <div class="ai-think-body"><div class="ai-think-content">${esc(sanitizeThinkText(msg.thinking))}</div></div>
    </div>`;
  }
  let sourcesHtml='';
  if(msg.userSearched&&msg.sources&&msg.sources.length){
    const items=msg.sources.map(s=>{let h='';try{h=new URL(s.url).hostname.replace('www.','');}catch(e){h=s.url;}
      return`<a class="source-item" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><img class="source-favicon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=32" alt="" onerror="this.style.display='none'"/><div class="source-text"><span class="source-name">${esc(s.title||h)}</span><span class="source-url">${esc(h)}</span></div></a>`;}).join('');
    sourcesHtml=`<div class="sources-wrap"><button class="sources-toggle" onclick="toggleSources(this)"><svg class="sources-chev" width="8" height="8" viewBox="0 0 4 4" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="1" width="1" height="2"/><rect x="1" y="0" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="1" width="1" height="2"/></svg>Sources (${msg.sources.length})</button><div class="sources-list">${items}</div></div>`;
  }
  const html=DOMPurify.sanitize(marked.parse(msg.content||''));
  let imgHtml='';if(msg.imageUrl)imgHtml=`<div class="ai-image"><img src="${esc(msg.imageUrl)}" alt="Generated image" loading="lazy"/></div>`;
  let acts='';
  if(msg.truncated)acts=`<button class="ma-btn continue-btn" onclick="continueMsg(${idx})">Continue</button>`;
  if(msg.emptyRetry)acts=`<button class="ma-btn" onclick="retryEmpty(${idx})" style="color:#e06060">Retry</button>`;
  return`<div class="msg-row ai" data-msg-index="${idx}" ${cma}><div class="msg-in"><div class="msg-content"><img class="ai-av" src="icon.webp" alt=""/><div class="ai-body">${badge}${thinkHtml}<div class="ai-txt" id="msg-${idx}-text">${imgHtml}${html}</div>${sourcesHtml}${ts}<div class="msg-acts" id="msg-${idx}-acts">${acts}</div></div></div></div></div>`;
}

const EXT={html:'html',htm:'html',css:'css',scss:'scss',javascript:'js',js:'js',jsx:'jsx',typescript:'ts',ts:'ts',tsx:'tsx',python:'py',py:'py',java:'java',c:'c',cpp:'cpp',csharp:'cs',cs:'cs',go:'go',rust:'rs',rs:'rs',ruby:'rb',rb:'rb',php:'php',swift:'swift',kotlin:'kt',kt:'kt',sql:'sql',json:'json',xml:'xml',yaml:'yml',yml:'yml',markdown:'md',md:'md',bash:'sh',sh:'sh',shell:'sh',vue:'vue',svelte:'svelte',dart:'dart',lua:'lua'};
function downloadCode(btn){const codeEl=btn.closest('.code-wrap').querySelector('code');if(!codeEl)return;const rawLang=(btn.dataset.lang||'code').toLowerCase().replace(/^language-/,'');const ext=EXT[rawLang]||rawLang||'txt';const mimeMap={html:'text/html',css:'text/css',js:'application/javascript',json:'application/json',svg:'image/svg+xml'};const blob=new Blob([codeEl.innerText],{type:(mimeMap[ext]||'text/plain')+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`code.${ext}`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}
function viewCode(btn){const codeEl=btn.closest('.code-wrap').querySelector('code');if(!codeEl)return;const code=codeEl.innerText;const lang=(btn.dataset.lang||'code').toLowerCase().replace('language-','');let html='';

  else if(['javascript','js','jsx','typescript','ts','tsx'].includes(lang)){html=`<!DOCTYPE html><html><head><style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:20px}pre{background:#1a1a1a;padding:12px;border-radius:8px}.error{color:#ff6b6b}</style></head><body><div id="o"></div><script>const _o=document.getElementById('o');console.log=(...a)=>{_o.innerHTML+='<pre>'+a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join('')+'</pre>'};try{${code}}catch(e){_o.innerHTML+='<pre class="error">'+e.message+'</pre>'}<\/script></body></html>`;}

  else{html=`<!DOCTYPE html><html><head><style>body{font-family:monospace;background:#111;color:#eee;padding:20px;white-space:pre-wrap;font-size:13px}</style></head><body>${esc(code)}</body></html>`;}
  document.getElementById('view-title').textContent=`View · ${lang}`;document.getElementById('view-frame').srcdoc=html;document.getElementById('view-ov').classList.add('show');

async function sendMsg(){
  const inp=document.getElementById('user-input');if(!inp)return;const raw=inp.value.trim();if(!raw||S.busy)return;
  S.busy=true;// Lock immediately — prevent double-sends before generate() sets it

  if(c.msgs.length===1){c.title=mkTitle(raw);setTitle(c.title);}
  c.ts=Date.now();inp.value='';autoGrow(inp);
  const sb=document.getElementById('send-btn');if(sb){sb.disabled=true;applyColors();}
  renderMsgs();renderSB();
  if(modeOn('image')){await genImage(c,raw);S.busy=false;if(sb){sb.disabled=!inp.value.trim();applyColors();}return;}
  let userSearchData=null;const userWantsSearch=queryNeedsSearch(raw);
  if(userWantsSearch){showUserSearchInd();userSearchData=await doSearch(raw);hideUserSearchInd();}
  const aiId='ai'+uid();appendPending(aiId);await generate(c,aiId,userSearchData,raw,userWantsSearch);

function appendPending(id){
  const ca=document.getElementById('chat-area');if(!ca)return;
  const m=MODELS[S.model]||MODELS['0'];const row=document.createElement('div');row.className='msg-row ai';row.id=id;
  if(m.hasThink){

    </div></div></div></div>`;

  ca.appendChild(sr);scrollBot();
}

async function* streamRaw(msgs,extraCtx,modelKey,maxTok,abortSignal){
  const mDef=MODELS[modelKey]||MODELS['0'];let res;
  try{res=await fetch('/api/chat.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,context:extraCtx,temperature:mDef.temp,maxTokens:maxTok||8000,model:modelKey}),signal:abortSignal});}
  catch(e){if(e.name!=='AbortError')throw e;return;}
  if(!res.ok)throw new Error('HTTP '+res.status);
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
  try{while(true){const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()??'';
    for(const line of lines){
      const l=line.trim();if(!l.startsWith('data:'))continue;
      const raw=l.slice(5).trim();if(raw==='[DONE]')return;
      try{const d=JSON.parse(raw);const choice=d.choices?.[0];if(!choice)continue;
        if(choice.finish_reason)yield{type:'finish',reason:choice.finish_reason};
        const text=choice.delta?.content;
        if(typeof text==='string'&&text.length)yield text;
      }catch(_){}
    }
  }}catch(e){if(e.name!=='AbortError')throw e;}
}
const OPEN_TAGS=['<think>','<thinking>','<|begin_of_thought|>'];
const CLOSE_TAGS=['</think>','</thinking>','<|end_of_thought|>'];
const MAX_TAG_LEN=22;
function findFirst(buf,tags){let best=-1,bestTag=null;for(const t of tags){const i=buf.indexOf(t);if(i!==-1&&(best===-1||i<best)){best=i;bestTag=t;}}return{idx:best,tag:bestTag};}

// streamParsed always yields objects: {type:'think'|'answer'|'finish', text?:string, reason?:string}
// isThinkModel=false → everything is yielded as {type:'answer',text} with no tag parsing.
// isThinkModel=true  → splits on <think>...</think>; rogue second <think> blocks are dropped.
async function* streamParsed(msgs,extraCtx,modelKey,maxTok,abortSignal,isThinkModel){
  if(isThinkModel===undefined)isThinkModel=true;
  let inThink=false,thinkSeen=false,buffer='';
  for await(const delta of streamRaw(msgs,extraCtx,modelKey,maxTok,abortSignal)){
    if(delta&&typeof delta==='object'){yield delta;continue;}
    if(!isThinkModel){
      if(delta.length)yield{type:'answer',text:delta};
      continue;
    }
    buffer+=delta;
    while(buffer.length>0){
      if(inThink){
        const{idx,tag}=findFirst(buffer,CLOSE_TAGS);
        if(idx!==-1){
          if(idx>0)yield{type:'think',text:buffer.substring(0,idx)};
          inThink=false;buffer=buffer.substring(idx+tag.length);
        }else{
          const safe=Math.max(0,buffer.length-MAX_TAG_LEN);
          if(safe>0){yield{type:'think',text:buffer.substring(0,safe)};buffer=buffer.substring(safe);}
          break;
        }
      }else{
        const{idx,tag}=findFirst(buffer,OPEN_TAGS);
        if(idx!==-1){
          if(idx>0)yield{type:'answer',text:buffer.substring(0,idx)};
          if(!thinkSeen){
            inThink=true;thinkSeen=true;buffer=buffer.substring(idx+tag.length);
          }else{
            // Rogue second <think> block — swallow entire block
            const rest=buffer.substring(idx+tag.length);
            const{idx:ci,tag:ct}=findFirst(rest,CLOSE_TAGS);
            buffer=ci!==-1?rest.substring(ci+ct.length):'';
            if(ci===-1)break;
          }
        }else{
          const safe=Math.max(0,buffer.length-MAX_TAG_LEN);
          if(safe>0){yield{type:'answer',text:buffer.substring(0,safe)};buffer=buffer.substring(safe);}
          break;
        }
      }
    }
  }
  if(buffer.length>0){
    yield inThink?{type:'think',text:buffer}:{type:'answer',text:buffer};
  }
}

async function generate(convo,aiId,userSearchData,userQuery,userWantsSearch,contMode){
  contMode=contMode||false;S.busy=true;
  const txtEl=document.getElementById(aiId+'txt');
  const thinkEl=document.getElementById(aiId+'think');
  const thCont=document.getElementById(aiId+'thcont');
  const thLbl=document.getElementById(aiId+'thlbl');
  const awEl=document.getElementById(aiId+'aw');
  const modelKey=S.model;const mDef=MODELS[modelKey]||MODELS['0'];const useThink=mDef.hasThink;
  const baseMsgs=convo.msgs.map(m=>({role:m.role,content:m.content}));
  let thinkText='',answerText='',tStart=Date.now(),thinkDurStr=null,answerPhase=false;
  let internalSearchFired=false,internalSearchData=null;
  let extraCtx=dtCtx();if(modeOn('code'))extraCtx+=CODE_MODE_EXTRA;
  if(userSearchData&&(userSearchData.results?.length||userSearchData.answer))extraCtx+=buildSearchCtx(userSearchData);
  if(contMode)extraCtx+='\n\nResume the previous response without repeating any prior text.';
  S.abort=new AbortController();

  // Called once when the first answer chunk arrives — transitions UI from thinking→answering
  const enterAnswerPhase=()=>{
    if(answerPhase)return;answerPhase=true;
    thinkDurStr=((Date.now()-tStart)/1000).toFixed(1);
    if(thinkEl){thinkEl.classList.remove('streaming');}// keep .open — block stays visible
    if(thLbl)thLbl.textContent='Thought for '+thinkDurStr+'s';
    if(awEl)awEl.remove();
    if(txtEl){
      txtEl.style.display='';
      const aState=modeOn('code')?'coding':'writing';
      const aLabel=modeOn('code')?'Writing Code':'Writing';
      txtEl.innerHTML='<div class="activity-wrap" data-state="'+aState+'"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">'+aLabel+'</div></div></div>';
    }
    if(S.settings.autoscroll)scrollBot();
  };

  // Render current answerText into txtEl with streaming cursor
  const renderAnswer=()=>{
    if(!txtEl)return;
    const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
    txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';
    if(S.settings.autoscroll)scrollBot();
  };

  // Write think text chunk into the think block text node
  const renderThink=(text)=>{
    thinkText+=text;
    if(thCont){
      if(!thCont._tn){thCont._tn=document.createTextNode('');thCont.appendChild(thCont._tn);}
      thCont._tn.nodeValue=sanitizeThinkText(thinkText);
      if(S.settings.autoscroll)scrollBot();
    }
  };

  try{
    if(useThink){
      // ── THINK MODEL PATH ──────────────────────────────────
      tStart=Date.now();
      let runWithSmartSearch=false,firstPass=true;
      while(true){
        runWithSmartSearch=false;
        for await(const chunk of streamParsed(baseMsgs,extraCtx,modelKey,8000,S.abort.signal,true)){
          if(S.abort?.signal?.aborted&&!internalSearchFired)break;
          if(chunk&&typeof chunk==='object'&&chunk.type==='finish')continue;// ignore finish events
          if(chunk.type==='think'){
            if(answerPhase){// model leaked think after answer — treat as answer
              answerText+=chunk.text;renderAnswer();
            }else{
              renderThink(chunk.text);
              // Smart search trigger: if think block shows uncertainty, search mid-think
              if(firstPass&&!internalSearchFired&&S.settings.webSearchAuto&&!userSearchData&&thinkText.length>80&&detectUncertainty(thinkText)){
                internalSearchFired=true;runWithSmartSearch=true;if(S.abort)S.abort.abort();break;
              }
            }
          }else if(chunk.type==='answer'){
            enterAnswerPhase();
            answerText+=chunk.text;renderAnswer();
          }
        }
        if(runWithSmartSearch){
          // Show search pill inside think block
          let pill=null;
          if(thCont){pill=document.createElement('div');pill.className='think-srch-pill';pill.innerHTML='Searching for more info<div class="think-srch-dot"></div><div class="think-srch-dot"></div><div class="think-srch-dot"></div>';thCont.appendChild(pill);if(S.settings.autoscroll)scrollBot();}
          const q=userQuery||baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content||'';
          internalSearchData=await doSearch(q);
          if(pill&&thCont){const done=document.createElement('div');done.className='think-srch-done';done.textContent='Found info — continuing';pill.replaceWith(done);}
          extraCtx=extraCtx+(internalSearchData?buildSearchCtx(internalSearchData):'')+'\n\nUse the information above and reply with the final answer only.';
          S.abort=new AbortController();userSearchData=internalSearchData;firstPass=false;
          // Reset think text node so second pass starts fresh
          if(thCont&&thCont._tn){thCont._tn.nodeValue='';thCont._tn=null;}thinkText='';
          continue;
        }else{break;}
      }

      // If model never transitioned to answer phase, try to promote tail of think block.
      // This handles models that write their final answer as the last paragraph of reasoning.
      if(!answerPhase){
        const promoted=promoteThinkTail(thinkText);
        if(promoted){
          answerText=promoted;enterAnswerPhase();
        }else{
          // Last resort: if the think block has ANY content, show a generic fallback answer
          // so the UI never displays a blank answer area. The think block itself is visible.
          thinkDurStr=((Date.now()-tStart)/1000).toFixed(1);
          if(thinkEl)thinkEl.classList.remove('streaming');
          if(thLbl)thLbl.textContent='Thought for '+thinkDurStr+'s';
          if(awEl)awEl.remove();
          if(txtEl){txtEl.style.display='';txtEl.innerHTML='';}
        }
      }

      // Finalize answer text area
      if(txtEl){
        const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
        txtEl.style.display='';
        txtEl.innerHTML=answerText?DOMPurify.sanitize(marked.parse(answerText)):DOMPurify.sanitize(marked.parse('_(No answer generated — try again)_'));
      }

    }else{
      // ── PLAIN MODEL PATH ─────────────────────────────────
      let wasTruncated=false;
      for await(const chunk of streamParsed(baseMsgs,extraCtx,modelKey,4096,S.abort.signal,false)){
        if(S.abort?.signal?.aborted)break;
        if(chunk&&chunk.type==='finish'){if(chunk.reason==='length')wasTruncated=true;continue;}
        const txt=(chunk&&chunk.text)||'';if(!txt)continue;
        answerText+=txt;
        if(txtEl){
          const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
          txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';
          if(S.settings.autoscroll)scrollBot();
        }
      }
      // Uncertainty re-answer: only if not truncated (truncated = mid-sentence, always looks uncertain)
      if(!wasTruncated&&answerText&&!userSearchData&&S.settings.webSearchAuto&&!modeOn('image')&&detectUncertainty(answerText)){
        showUserSearchInd();
        const q=userQuery||baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content||'';
        const sd=await doSearch(q);hideUserSearchInd();
        if(sd){
          userSearchData=sd;userWantsSearch=true;
          const ctx2=extraCtx+buildSearchCtx(sd);
          if(txtEl)txtEl.innerHTML='<div class="activity-wrap" data-state="writing"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">Re-answering</div></div></div>';
          answerText='';S.abort=new AbortController();
          for await(const chunk of streamParsed(baseMsgs,ctx2,modelKey,4096,S.abort.signal,false)){
            if(S.abort?.signal?.aborted)break;
            const txt=(chunk&&chunk.text)||'';if(!txt)continue;
            answerText+=txt;
            if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';if(S.settings.autoscroll)scrollBot();}
          }
        }
      }
      if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText||''));}
    }
  }catch(err){
    if(err.name!=='AbortError'){
      document.getElementById(aiId)?.remove();document.getElementById('stop-row')?.remove();
      showErr(err.message||null);S.busy=false;S.abort=null;
      const inp=document.getElementById('user-input');const sb=document.getElementById('send-btn');
      if(sb){sb.disabled=!inp||!inp.value.trim();applyColors();}return;
    }
  }

  // ── FINALIZE ─────────────────────────────────────────────
  document.getElementById('stop-row')?.remove();
  const effectiveSources=userWantsSearch?(userSearchData?.results||[]):[];
  const savedAnswer=answerText.trim();
  const savedThinking=sanitizeThinkText(thinkText).trim()||null;

  if(!savedAnswer&&!thinkText.trim()){
    // Truly empty — no thinking, no answer
    convo.msgs.push({role:'assistant',content:'_(No response — tap Retry)_',ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:modeOn('code'),thinking:null,thinkDuration:null,truncated:false,emptyRetry:true,modelKey});
  }else if(!savedAnswer&&savedThinking){
    // Model produced thinking but no separate answer — thinking IS the response
    // The UI shows the think block; set content to empty string (not the retry placeholder)
    convo.msgs.push({role:'assistant',content:'',ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:modeOn('code'),thinking:savedThinking,thinkDuration:thinkDurStr,truncated:false,modelKey});
  }else{
    convo.msgs.push({role:'assistant',content:savedAnswer,ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:modeOn('code'),thinking:savedThinking,thinkDuration:thinkDurStr,truncated:false,modelKey});
  }
  const msgIdx=convo.msgs.length-1;
  const pendingRow=document.getElementById(aiId);

  if(useThink&&pendingRow){
    // Think models: DOM is already correct — think block visible, answer rendered.
    // Just tag it, remove streaming cursor, add action buttons. Never re-render.
    pendingRow.dataset.msgIndex=msgIdx;
    pendingRow.querySelectorAll('.stream-cur').forEach(el=>el.remove());
    pendingRow.querySelector('.answer-waiting')?.remove();
    pendingRow.querySelector('.ai-think')?.classList.remove('streaming');
    const aiBody=pendingRow.querySelector('.ai-body');
    if(aiBody){
      const actsEl=document.createElement('div');actsEl.className='msg-acts';actsEl.id='msg-'+msgIdx+'-acts';
      aiBody.appendChild(actsEl);
    }
    attachCodeBtns();
  }else if(pendingRow){
    // Plain models: replace the pending row with final rendered HTML
    const finalHtml=buildMsg(convo.msgs[msgIdx],msgIdx);
    const tmp=document.createElement('div');tmp.innerHTML=finalHtml;
    pendingRow.replaceWith(tmp.firstElementChild);
    attachCodeBtns();
  }else{
    renderMsgs();
  }

  saveStore();S.busy=false;S.abort=null;
  const inp=document.getElementById('user-input');const sb=document.getElementById('send-btn');
  if(sb){sb.disabled=!inp||!inp.value.trim();applyColors();}scrollBot();
}

function promoteThinkTail(thinkText){
  if(!thinkText)return'';
  const t=thinkText.trim();
  if(!t)return'';

  // Strategy 1: explicit answer marker (e.g. "Final answer:", "Answer:", "So the answer is")
  const markerRe=/(?:^|\n)\s*(?:final\s+answer|final\s+response|answer|so\s+the\s+answer\s+is|so\s+my\s+answer\s+is|to\s+summarize|in\s+summary|therefore|thus,?|in\s+conclusion|conclusion|tldr|tl;dr|here(?:'s|\s+is)(?:\s+the|\s+my)?\s+answer)\s*[:\-—]\s*/i;
  const m=t.match(markerRe);
  if(m&&m.index!==undefined){
    const after=t.slice(m.index+m[0].length).trim();
    if(after.length>10)return after;
  }

  // Strategy 2: last non-empty paragraph (double newline separator)
  const paras=t.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>20);
  if(paras.length>=2){
    const last=paras[paras.length-1];
    // Only promote if it doesn't look like pure internal monologue (starts with "Let me", "I need to", etc.)
    if(!/^(?:let me|i need to|i should|i must|i will|first,|step \d|okay,|alright,|so,?\s+i)/i.test(last))return last;
  }

  // Strategy 3: last 3+ lines of the block
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length>=3){
    const tail=lines.slice(-3).join('\n');
    if(tail.length>20&&!/^(?:let me|i need to|i should|step \d)/i.test(tail))return tail;
  }

  return'';
}

function stopGen(){if(S.abort)S.abort.abort();}
function showErr(msg){const ca=document.getElementById('chat-area');if(!ca)return;document.getElementById('err-row')?.remove();const r=document.createElement('div');r.className='err-row';r.id='err-row';const displayMsg=msg||'Failed to get a response';const isRateLimit=/rate.?limit|slow.?down|busy/i.test(displayMsg);r.innerHTML=`<div class="err-box"><span class="err-msg">${esc(displayMsg)}</span><button class="retry-btn" onclick="retryLast()">Retry</button></div>`;ca.appendChild(r);scrollBot();if(isRateLimit){const retryDelay=8000;const countdown=r.querySelector('.err-msg');let secs=Math.round(retryDelay/1000);const iv=setInterval(()=>{secs--;if(countdown&&document.getElementById('err-row'))countdown.textContent=displayMsg+' Retrying in '+secs+'s…';if(secs<=0){clearInterval(iv);if(document.getElementById('err-row'))retryLast();}},1000);r._retryIv=iv;}}

function isMobile(){return/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||'ontouchstart'in window;}
function scrollBot(smooth=false){const ca=document.getElementById('chat-area');if(!ca)return;ca.scrollTo({top:ca.scrollHeight,behavior:smooth?'smooth':'auto'});}

function showDialog(opts){document.getElementById('dialog-title').textContent=opts.title||'';document.getElementById('dialog-msg').textContent=opts.msg||'';const iw=document.getElementById('dialog-input-wrap'),inp=document.getElementById('dialog-input');if(opts.input){iw.style.display='block';inp.value=opts.inputVal||'';inp.placeholder=opts.input;}else{iw.style.display='none';}const bts=document.getElementById('dialog-btns');bts.innerHTML='';if(opts.cancel!==false){const cb=document.createElement('button');cb.className='dlg-btn cancel';cb.textContent=opts.cancelText||'Cancel';cb.onclick=closeDialog;bts.appendChild(cb);}const ok=document.createElement('button');ok.className='dlg-btn '+(opts.danger?'danger':'confirm');ok.textContent=opts.confirmText||'OK';ok.onclick=()=>{const v=inp?inp.value:'';closeDialog();if(opts.onConfirm)opts.onConfirm(v);};bts.appendChild(ok);document.getElementById('dialog-ov').classList.add('show');if(opts.input){setTimeout(()=>inp?.focus(),100);if(inp)inp.onkeydown=e=>{if(e.key==='Enter')ok.click();};}}
function closeDialog(){document.getElementById('dialog-ov').classList.remove('show');}
function dlgConfirm(t,m,onY,d){showDialog({title:t,msg:m,onConfirm:onY,danger:d,confirmText:d?'Delete':'Confirm'});}

function openSettings(){closeSidebar();renderSettings();document.getElementById('settings-ov').classList.add('show');}
function closeSettings(){document.getElementById('settings-ov').classList.remove('show');}
function renderSettings(){const body=document.getElementById('sheet-body');if(!body)return;body.innerHTML=`<div class="sg"><div class="sg-lbl">Display</div><div class="s-row"><div class="s-row-info"><div class="s-name">Show timestamps</div><div class="s-desc">Time under each message</div></div><div class="tog ${S.settings.timestamps?'on':''}" onclick="togSet('timestamps',this)"></div></div><div class="s-row"><div class="s-row-info"><div class="s-name">Auto-scroll</div><div class="s-desc">Follow new messages</div></div><div class="tog ${S.settings.autoscroll?'on':''}" onclick="togSet('autoscroll',this)"></div></div></div><div class="sg"><div class="sg-lbl">Web Search</div><div class="s-row"><div class="s-row-info"><div class="s-name">Smart auto-search</div><div class="s-desc">Only searches when AI genuinely lacks real-time data</div></div><div class="tog ${S.settings.webSearchAuto?'on':''}" onclick="togSet('webSearchAuto',this)"></div></div></div><div class="sg"><div class="sg-lbl">Data</div><div class="s-row"><div class="s-row-info"><div class="s-name">Save conversations</div><div class="s-desc">Keep history on device</div></div><div class="tog ${S.settings.save?'on':''}" onclick="togSet('save',this)"></div></div><div class="s-row"><div class="s-row-info"><div class="s-name">Reset app</div><div class="s-desc">Wipe all data and reload</div></div><button class="s-btn" onclick="nukeAll()">Reset</button></div></div>`;}
function togSet(k,el){S.settings[k]=!S.settings[k];if(el)el.classList.toggle('on',S.settings[k]);saveStore();}
function nukeAll(){dlgConfirm('Reset everything?','All data will be wiped.',()=>{try{localStorage.clear();}catch(e){}location.reload();},true);}

function copyText(text,onDone){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(onDone).catch(()=>fbCopy(text,onDone));}else fbCopy(text,onDone);}
function fbCopy(text,onDone){try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(onDone)onDone();}catch(e){}}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>
</body>
</html>
