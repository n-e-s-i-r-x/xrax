<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>0vAi</title>
<link rel="icon" href="icon.webp" type="image/png"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
@font-face{font-family:"M";src:url("M.ttf")format("truetype");}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:"M",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased;font-size:16px;overscroll-behavior:none;}
button,input,textarea{font-family:"M";font-size:16px;color:inherit;}
button{cursor:pointer;border:none;background:none;}
input,textarea{outline:none;border:none;background:none;}
::-webkit-scrollbar{width:0;height:0;}

/* ── GLOBAL THEME VARIABLES ── */
:root{
  --accent:#444;
  --accent-dim:rgba(68,68,68,0.15);
  --accent-subtle:rgba(68,68,68,0.08);
  --accent-border:rgba(68,68,68,0.35);
}

#intro{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 1s ease;}
#intro.hide{opacity:0;pointer-events:none;}
#intro-logo{width:72px;height:72px;object-fit:contain;animation:introPop 3s cubic-bezier(0.34,1.56,0.64,1) forwards;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;}
@keyframes introPop{0%{opacity:0;transform:scale(0.6)}100%{opacity:1;transform:scale(1)}}
#intro-pulse{position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.05);animation:iPulse 1.5s ease-out infinite;}
@keyframes iPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.5);opacity:0}}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;opacity:0;transition:opacity 0.4s ease;}
#app.ready{opacity:1;}

/* ── TOPBAR ── */
#topbar{flex-shrink:0;display:flex;align-items:center;padding:0 12px;gap:10px;background:#000;border-bottom:1px solid #141414;padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));transition:border-color .3s;}
#topbar.themed{border-bottom-color:var(--accent-border);}
.tb-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#888;flex-shrink:0;transition:background .15s,color .15s,transform .1s;}
.tb-btn:active{background:#141414;color:#fff;transform:scale(.92);}
#topbar.themed .tb-btn{color:var(--accent);opacity:.7;}
#topbar.themed .tb-btn:active{opacity:1;background:var(--accent-subtle);}
.tb-center{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
.tb-title{font-size:15px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

#chat-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
#chat-area{flex:1;overflow-y:auto;padding:16px 0 8px;-webkit-overflow-scrolling:touch;}

#empty-state{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:14px;animation:fadeUp .5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#empty-logo{width:60px;height:60px;object-fit:contain;opacity:.5;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;}
#empty-h{font-size:22px;font-weight:700;color:#ddd;text-align:center;}
#empty-s{font-size:14px;color:#555;text-align:center;max-width:300px;line-height:1.5;}

.msg-row{padding:4px 0;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg-row.user .msg-in{padding:0 14px;display:flex;flex-direction:column;align-items:flex-end;}
.u-bubble{background:#1a1a1a;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;font-size:15px;line-height:1.5;color:#fff;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;transition:border-color .3s;}
body.themed .u-bubble{border:1px solid var(--accent-border);background:var(--accent-subtle);}

.msg-row.ai .msg-in{padding:0 14px;}
.msg-row.ai .msg-content{display:flex;gap:10px;align-items:flex-start;}
.ai-av{display:none;}
.ai-body{flex:1;min-width:0;}
.ai-txt{font-size:15px;line-height:1.6;color:#ddd;word-wrap:break-word;overflow-wrap:break-word;}
.ai-txt h1,.ai-txt h2,.ai-txt h3{color:#fff;margin:12px 0 6px;font-weight:600;}
.ai-txt h1{font-size:20px}.ai-txt h2{font-size:17px}.ai-txt h3{font-size:15px}
.ai-txt p{margin:0 0 8px}.ai-txt p:last-child{margin:0}
.ai-txt ul,.ai-txt ol{margin:6px 0 8px 20px}.ai-txt li{margin:3px 0}
.ai-txt strong{color:#fff;font-weight:600}
.ai-txt a{color:#4a9eff;text-decoration:underline}
body.themed .ai-txt a{color:var(--accent);}
.ai-txt blockquote{border-left:3px solid #2a2a2a;padding:4px 12px;color:#888;margin:8px 0;transition:border-color .3s;}
body.themed .ai-txt blockquote{border-left-color:var(--accent-border);}
.ai-txt code:not(pre code){background:#1a1a1a;border-radius:4px;padding:2px 6px;font-family:"M",Menlo,monospace;font-size:13px;color:#ddd;transition:border .3s;}
body.themed .ai-txt code:not(pre code){border:1px solid var(--accent-border);background:var(--accent-subtle);}
.ai-txt .prose-block{background:#0a0a0a;border-left:2px solid #222;border-radius:0 8px 8px 0;padding:8px 12px;margin:6px 0 10px;line-height:1.7;transition:border-color .3s;}
body.themed .ai-txt .prose-block{border-left-color:var(--accent-border);background:var(--accent-subtle);}
.ai-txt .prose-block p{margin:0 0 6px}.ai-txt .prose-block p:last-child{margin:0}
.ai-txt .callout{display:flex;gap:10px;background:#0d0d0d;border:1px solid #222;border-radius:10px;padding:10px 12px;margin:8px 0;transition:border-color .3s,background .3s;}
body.themed .ai-txt .callout{border-color:var(--accent-border);background:var(--accent-subtle);}
.ai-txt .callout-icon{font-size:14px;flex-shrink:0;margin-top:1px;opacity:.8}
.ai-txt .callout-body{flex:1;min-width:0;font-size:14px;line-height:1.6;color:#aaa;}
body.themed .ai-txt .callout-body{color:#bbb;}
.ai-txt .callout-body p{margin:0 0 4px}.ai-txt .callout-body p:last-child{margin:0}
.ai-txt .steps-block{margin:8px 0;}
.ai-txt .steps-block ol{list-style:none;margin:0;padding:0;}
.ai-txt .steps-block li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #141414;transition:border-color .3s;}
body.themed .ai-txt .steps-block li{border-bottom-color:var(--accent-border);opacity:.9;}
.ai-txt .steps-block li:last-child{border-bottom:none;padding-bottom:0}
.ai-txt .steps-block li:first-child{padding-top:0}
.ai-txt .step-num{width:22px;height:22px;border-radius:50%;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#888;flex-shrink:0;margin-top:1px;transition:border-color .3s,background .3s,color .3s;}
body.themed .ai-txt .step-num{border-color:var(--accent-border);background:var(--accent-subtle);color:var(--accent);}
.ai-txt .step-body{flex:1;min-width:0;font-size:15px;line-height:1.55;color:#ddd;}
.ai-txt .step-body strong:first-child{display:block;color:#fff;margin-bottom:2px;}
.ai-txt .kv-block{background:#080808;border:1px solid #1a1a1a;border-radius:10px;overflow:hidden;margin:8px 0;transition:border-color .3s;}
body.themed .ai-txt .kv-block{border-color:var(--accent-border);}
.ai-txt .kv-row{display:flex;gap:0;border-bottom:1px solid #111;transition:border-color .3s;}
body.themed .ai-txt .kv-row{border-bottom-color:var(--accent-border);opacity:.85;}
.ai-txt .kv-row:last-child{border-bottom:none}
.ai-txt .kv-key{padding:7px 10px;font-size:12px;font-weight:700;color:#888;background:#0f0f0f;min-width:90px;max-width:130px;flex-shrink:0;letter-spacing:.2px;transition:background .3s,color .3s;}
body.themed .ai-txt .kv-key{background:var(--accent-subtle);color:var(--accent);}
.ai-txt .kv-val{padding:7px 10px;font-size:13px;color:#ccc;flex:1;line-height:1.5;}
.ai-txt .tbl-wrap{overflow-x:auto;margin:8px 0;border-radius:10px;border:1px solid #1a1a1a;transition:border-color .3s;}
body.themed .ai-txt .tbl-wrap{border-color:var(--accent-border);}
.ai-txt table{width:100%;border-collapse:collapse;font-size:13px;}
.ai-txt th{background:#0f0f0f;color:#aaa;font-weight:700;padding:8px 10px;text-align:left;border-bottom:1px solid #1a1a1a;font-size:12px;letter-spacing:.3px;transition:background .3s,color .3s,border-color .3s;}
body.themed .ai-txt th{background:var(--accent-subtle);color:var(--accent);border-bottom-color:var(--accent-border);}
.ai-txt td{padding:7px 10px;color:#ccc;border-bottom:1px solid #111;transition:border-color .3s;}
body.themed .ai-txt td{border-bottom-color:var(--accent-border);opacity:.9;}
.ai-txt tr:last-child td{border-bottom:none}
.ai-txt hr{border:none;border-top:1px solid #1e1e1e;margin:12px 0;transition:border-color .3s;}
body.themed .ai-txt hr{border-top-color:var(--accent-border);}
.ai-txt .lbl-pill{display:inline-block;background:#141414;border:1px solid #242424;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;color:#888;margin-right:4px;vertical-align:middle;letter-spacing:.2px;transition:border-color .3s,color .3s,background .3s;}
body.themed .ai-txt .lbl-pill{border-color:var(--accent-border);color:var(--accent);background:var(--accent-subtle);}

/* ── ACTIVITY / LOADING ORBS ── */
.activity-wrap{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.activity-orb{width:28px;height:28px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.activity-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;animation:orbSpin 1.8s linear infinite}
.activity-orb-dot{width:6px;height:6px;border-radius:50%;position:relative;z-index:1}
.activity-wrap[data-state="thinking"] .activity-orb-ring{border-top-color:#a855f7;border-right-color:rgba(168,85,247,.4)}
.activity-wrap[data-state="thinking"] .activity-orb-dot{background:#a855f7}
.activity-wrap[data-state="writing"] .activity-orb-ring{border-top-color:#ddd;border-right-color:rgba(221,221,221,.4)}
.activity-wrap[data-state="writing"] .activity-orb-dot{background:#bbb}
.activity-wrap[data-state="coding"] .activity-orb-ring{border-top-color:#4ade80;border-right-color:rgba(74,222,128,.4)}
.activity-wrap[data-state="coding"] .activity-orb-dot{background:#4ade80}
.activity-wrap[data-state="searching"] .activity-orb-ring{border-top-color:#4a9eff;border-right-color:rgba(74,158,255,.4)}
.activity-wrap[data-state="searching"] .activity-orb-dot{background:#4a9eff}
.activity-wrap[data-state="imaging"] .activity-orb-ring{border-top-color:#fbbf24;border-right-color:rgba(251,191,36,.4)}
.activity-wrap[data-state="imaging"] .activity-orb-dot{background:#fbbf24}
body.themed .activity-wrap[data-state="writing"] .activity-orb-ring{border-top-color:var(--accent);border-right-color:var(--accent-dim);}
body.themed .activity-wrap[data-state="writing"] .activity-orb-dot{background:var(--accent);}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.activity-right{display:flex;flex-direction:column;gap:3px;min-width:0}
.activity-label{font-size:12px;font-weight:600;letter-spacing:.2px}
.activity-wrap[data-state="thinking"] .activity-label{color:#c084fc}
.activity-wrap[data-state="writing"] .activity-label{color:#bbb}
.activity-wrap[data-state="coding"] .activity-label{color:#4ade80}
.activity-wrap[data-state="searching"] .activity-label{color:#4a9eff}
.activity-wrap[data-state="imaging"] .activity-label{color:#fbbf24}
body.themed .activity-wrap[data-state="writing"] .activity-label{color:var(--accent);}
.activity-sub{font-size:11px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;font-style:italic}
.anim-dots::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}

/* ── THINK BLOCK ── */
.ai-think{margin-bottom:10px;border:1px solid #1e1530;border-radius:12px;overflow:hidden;background:#080810;transition:border-color .3s,background .3s;}
body.themed .ai-think{border-color:var(--accent-border);background:var(--accent-subtle);}
.ai-think-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#0d0b14;cursor:pointer;user-select:none;transition:background .15s;}
body.themed .ai-think-hdr{background:var(--accent-subtle);}
.ai-think-hdr:active{background:#120f1c}
body.themed .ai-think-hdr:active{background:var(--accent-dim);}
.ai-think-chev{transition:transform .25s ease;color:#c084fc;flex-shrink:0}
body.themed .ai-think-chev{color:var(--accent);}
.ai-think.open .ai-think-chev{transform:rotate(90deg)}
.ai-think-lbl{font-size:12px;font-weight:600;color:#c084fc;letter-spacing:.3px;flex:1;transition:color .3s;}
body.themed .ai-think-lbl{color:var(--accent);}
.ai-think.streaming .ai-think-lbl::after{content:'';display:inline-block;width:1.4em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
.ai-think-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.ai-think.open .ai-think-body{max-height:600px;overflow-y:auto}
.ai-think-content{padding:10px 12px 12px;font-size:12.5px;line-height:1.75;color:#7a6aaa;border-top:1px solid #1e1530;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;transition:color .3s,border-color .3s;}
body.themed .ai-think-content{border-top-color:var(--accent-border);color:#888;}

/* ── SEARCH PILLS ── */
.think-srch-pill{display:flex;align-items:center;gap:7px;background:#060f1c;border:1px solid #0e2035;border-radius:8px;padding:6px 11px;margin:6px 0;font-size:11px;color:#4a9eff;font-style:normal;width:fit-content}
.think-srch-dot{width:3px;height:3px;border-radius:50%;background:#4a9eff;animation:tsd 1.1s ease-in-out infinite;flex-shrink:0}
.think-srch-dot:nth-child(2){animation-delay:.18s}
.think-srch-dot:nth-child(3){animation-delay:.36s}
@keyframes tsd{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.think-srch-done{display:flex;align-items:center;gap:7px;background:#030d03;border:1px solid #0e2010;border-radius:8px;padding:6px 11px;margin:6px 0;font-size:11px;color:#4ade80;font-style:normal;width:fit-content}

.answer-waiting{display:flex;align-items:center;gap:8px;padding:6px 0 2px;opacity:.5}
.answer-waiting-dots{display:flex;gap:4px}
.answer-waiting-dots span{width:4px;height:4px;border-radius:50%;background:#555;animation:awDot 1.4s ease-in-out infinite;transition:background .3s;}
body.themed .answer-waiting-dots span{background:var(--accent);}
.answer-waiting-dots span:nth-child(2){animation-delay:.2s}
.answer-waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes awDot{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.answer-waiting-lbl{font-size:11px;color:#555;font-style:italic}

/* ── CODE BLOCKS ── */
.code-wrap{margin:10px 0;border-radius:10px;overflow:hidden;background:#0a0a0a;border:1px solid #1a1a1a;transition:border-color .3s;}
body.themed .code-wrap{border-color:var(--accent-border);}
.code-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#111;border-bottom:1px solid #1a1a1a;transition:border-color .3s,background .3s;}
body.themed .code-hdr{background:var(--accent-subtle);border-bottom-color:var(--accent-border);}
.code-lang{font-size:11px;color:#666;transition:color .3s;}
body.themed .code-lang{color:var(--accent);opacity:.6;}
.code-hdr-btns{display:flex;gap:5px;align-items:center}
.copy-code,.dl-btn,.view-btn{padding:4px 10px;background:#1a1a1a;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;transition:background .15s,border-color .3s;border:1px solid transparent;}
body.themed .copy-code{border-color:var(--accent-border);background:var(--accent-subtle);color:var(--accent);}
.copy-code{color:#aaa}.copy-code:active{background:#252525}
.dl-btn{color:#4a9eff}.dl-btn:active{background:#252525}
.view-btn{color:#4ade80}.view-btn:active{background:#252525}
.ai-txt pre{padding:12px;overflow-x:auto;margin:0;background:#0a0a0a}
.ai-txt pre code{background:none;padding:0;font-family:"M",Menlo,monospace;font-size:13px;color:#ccc;line-height:1.5}

/* ── MESSAGE ACTIONS ── */
.msg-acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.msg-copy-btn{display:none;padding:4px 10px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;color:#888;font-size:11px;align-items:center;gap:4px;transition:background .15s,transform .1s,border-color .3s;margin-top:4px;}
body.themed .msg-copy-btn{border-color:var(--accent-border);color:var(--accent);background:var(--accent-subtle);}
.msg-copy-btn:active{background:#1a1a1a;transform:scale(.94)}
.msg-copy-btn.show{display:flex;}
.ma-btn{padding:5px 10px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;color:#888;font-size:11px;display:flex;align-items:center;gap:4px;transition:background .15s,transform .1s,border-color .3s;}
body.themed .ma-btn{border-color:var(--accent-border);color:var(--accent);background:var(--accent-subtle);}
.ma-btn:active{background:#1a1a1a;transform:scale(.94)}
.msg-ts{font-size:10px;color:#444;margin-top:4px}

/* ── WEB BADGE & SOURCES ── */
.web-badge{display:inline-flex;align-items:center;gap:5px;background:#0a1628;border:1px solid #1a3050;border-radius:6px;padding:3px 8px;font-size:11px;color:#4a9eff;margin-bottom:8px;transition:border-color .3s,background .3s,color .3s;}
body.themed .web-badge{background:var(--accent-subtle);border-color:var(--accent-border);color:var(--accent);}
body.themed .web-badge svg{color:var(--accent);}
.sources-wrap{margin-top:10px;border-top:1px solid #141414;padding-top:8px;transition:border-color .3s;}
body.themed .sources-wrap{border-top-color:var(--accent-border);}
.sources-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#444;cursor:pointer;user-select:none;padding:2px 0 6px;background:none;border:none;transition:color .15s;}
body.themed .sources-toggle{color:var(--accent);opacity:.65;}
.sources-toggle:active{color:#888}
body.themed .sources-toggle:active{opacity:1;}
.sources-chev{transition:transform .28s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.sources-wrap.open .sources-chev{transform:rotate(90deg)}
.sources-list{overflow:hidden;max-height:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease;opacity:0}
.sources-wrap.open .sources-list{max-height:600px;opacity:1}
.source-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;text-decoration:none}
.source-favicon{width:14px;height:14px;border-radius:3px;flex-shrink:0;margin-top:2px;object-fit:contain}
.source-text{flex:1;min-width:0}
.source-name{font-size:12px;color:#4a9eff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-decoration:underline;transition:color .3s;}
body.themed .source-name{color:var(--accent);}
.source-url{font-size:10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ── INPUT AREA ── */
#input-area{flex-shrink:0;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #141414;transition:border-color .3s;}
body.themed #input-area{border-top-color:var(--accent-border);}
.input-box{background:#0a0a0a;border:2px solid #1e1e1e;border-radius:18px;display:flex;flex-direction:column;transition:border-color .2s;overflow:hidden}
.input-tools{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0}
.input-tools::-webkit-scrollbar{display:none}
.input-row{display:flex;align-items:flex-end;padding:4px 6px 6px 8px;gap:6px}
#user-input{flex:1;color:#fff;font-size:15px;line-height:1.4;resize:none;max-height:140px;min-height:32px;padding:7px 4px;overflow-y:auto;background:transparent}
#user-input::placeholder{color:#444}

/* ── MODEL PICKER POPUP ── */

.mp-badge.rapid{color:#ef4444;border:1px solid #3a1010}

/* ── FILE ATTACHMENT ── */
#file-tray{display:none;flex-direction:row;flex-wrap:wrap;gap:6px;padding:6px 12px 4px;background:#000;}

.attach-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;flex-shrink:0;transition:background .15s,color .15s,transform .1s;}
.attach-btn:active{background:#1a1a1a;color:#fff;transform:scale(.9);}

body.themed .attach-btn:active{opacity:1;background:var(--accent-subtle);}

body.themed .attach-btn.has-file{color:var(--accent);opacity:1;}
/* file chips inside user bubble */
.u-file-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.u-file-chip{display:inline-flex;align-items:center;gap:4px;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;color:#777;letter-spacing:.4px;text-transform:uppercase;}
body.themed .u-file-chip{border-color:var(--accent-border);color:var(--accent);background:var(--accent-subtle);}

/* ── FILE ATTACHMENT ── */
#file-tray{display:none;flex-direction:row;flex-wrap:wrap;gap:6px;padding:6px 12px 4px;}

.file-chip{display:flex;align-items:center;gap:6px;background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:5px 10px;font-size:12px;color:#bbb;max-width:220px;animation:chipIn .18s ease;transition:border-color .3s;}

.attach-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;flex-shrink:0;transition:background .15s,color .15s,transform .1s;}

/* ── STOP ROW ── */

/* ── SIDEBAR ── */

body.themed .sb-new{background:var(--accent);color:#000;}

.chat-list{flex:1;overflow-y:auto;padding:0 8px 8px}

.chat-item:active{background:#141414}

body.themed .chat-item.active svg{color:var(--accent);}
.chat-item-txt{flex:1;font-size:14px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item.active .chat-item-txt{color:#fff}
.chat-del{padding:6px;color:#444;border-radius:6px;display:flex;align-items:center;transition:background .15s,color .15s}
.chat-del:active{background:#2a1010;color:#cc6666}
.empty-list{padding:40px 16px;text-align:center;color:#444;font-size:13px}
.sb-foot{padding:8px;border-top:1px solid #141414;display:flex;flex-direction:column;gap:2px;transition:border-color .3s;}

.sb-fbtn{padding:12px;border-radius:10px;display:flex;align-items:center;gap:10px;color:#aaa;font-size:14px;text-align:left;transition:background .15s,color .3s;cursor:pointer}

.sb-fbtn.danger{color:#cc6666}

/* ── DIALOGS ── */
#dialog-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}

#view-ov{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column}

<script>
"use strict";
if(typeof marked==="undefined")window.marked={parse:s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")};

function throttle(fn,ms){let t=0,pending=false;return function(...a){const now=Date.now();if(now-t>=ms){t=now;fn.apply(this,a);}else if(!pending){pending=true;setTimeout(()=>{pending=false;t=Date.now();fn.apply(this,a);},ms-(now-t));}};}
if(typeof DOMPurify==="undefined")window.DOMPurify={sanitize:s=>s};

/* ══════════════════════════════════════
   SMART LAYOUT RENDERER
══════════════════════════════════════ */
function renderMd(text){
  if(!text)return'';
  const raw=DOMPurify.sanitize(marked.parse(text));
  const tmp=document.createElement('div');
  tmp.innerHTML=raw;
  const nodes=Array.from(tmp.childNodes);
  const tags=nodes.map(n=>n.nodeName);
  const hasHeading=tags.some(t=>/^H[1-3]$/.test(t));
  const hasCode=tags.some(t=>t==='PRE');
  const hasOL=tags.some(t=>t==='OL');
  const hasUL=tags.some(t=>t==='UL');
  const hasTable=tags.some(t=>t==='TABLE');
  const hasBlockquote=tags.some(t=>t==='BLOCKQUOTE');
  const pCount=tags.filter(t=>t==='P').length;
  const totalText=tmp.textContent.trim();
  const isRich=hasHeading||hasCode||hasTable||(hasOL&&pCount>0)||(hasUL&&pCount>1);
  const isConversational=!isRich&&!hasBlockquote&&totalText.length<300&&pCount<=2;

  const out=document.createElement('div');
  let i=0;
  const appendNode=n=>out.appendChild(n.cloneNode(true));
  while(i<nodes.length){
    const node=nodes[i];
    const tag=node.nodeName;
    if(/^H[1-3]$/.test(tag)){appendNode(node);i++;continue;}
    if(tag==='HR'){appendNode(node);i++;continue;}
    if(tag==='TABLE'){
      const wrap=document.createElement('div');wrap.className='tbl-wrap';
      wrap.appendChild(node.cloneNode(true));
      out.appendChild(wrap);i++;continue;
    }
    if(tag==='BLOCKQUOTE'){
      const inner=(node.textContent||'').trim();
      const prefixM=inner.match(/^(note|tip|warning|warn|info|important)[:\s]/i);
      const icon=prefixM?{note:'ℹ',tip:'💡',warning:'⚠',warn:'⚠',info:'ℹ',important:'⚡'}[prefixM[1].toLowerCase()]||'💬':'💬';
      const callout=document.createElement('div');callout.className='callout';
      const iconEl=document.createElement('span');iconEl.className='callout-icon';iconEl.textContent=icon;
      const body=document.createElement('div');body.className='callout-body';
      body.innerHTML=node.innerHTML;
      callout.appendChild(iconEl);callout.appendChild(body);
      out.appendChild(callout);i++;continue;
    }
    if(tag==='OL'){
      if(isRich){
        const stepsWrap=document.createElement('div');stepsWrap.className='steps-block';
        const ol=document.createElement('ol');
        Array.from(node.children).forEach((li,idx)=>{
          const item=document.createElement('li');
          const numEl=document.createElement('span');numEl.className='step-num';numEl.textContent=idx+1;
          const bodyEl=document.createElement('div');bodyEl.className='step-body';
          bodyEl.innerHTML=li.innerHTML;
          item.appendChild(numEl);item.appendChild(bodyEl);
          ol.appendChild(item);
        });
        stepsWrap.appendChild(ol);
        out.appendChild(stepsWrap);
      }else{
        appendNode(node);
      }
      i++;continue;
    }
    if(tag==='UL'){appendNode(node);i++;continue;}
    if(tag==='PRE'){appendNode(node);i++;continue;}
    if(tag==='P'){
      const run=[];
      let j=i;
      while(j<nodes.length&&nodes[j].nodeName==='P'){run.push(nodes[j]);j++;}
      const runText=run.map(n=>n.textContent||'').join(' ').trim();
      if(isConversational||runText.length<60){
        run.forEach(n=>appendNode(n));
      }else if(isRich&&runText.length>=80){
        const wrap=document.createElement('div');wrap.className='prose-block';
        run.forEach(n=>{
          const clone=n.cloneNode(true);
          clone.innerHTML=clone.innerHTML.replace(/<strong>([^<]{1,30}):<\/strong>\s*/g,
            (_,lbl)=>`<span class="lbl-pill">${lbl}</span> `);
          wrap.appendChild(clone);
        });
        out.appendChild(wrap);
      }else{
        run.forEach(n=>{
          const clone=n.cloneNode(true);
          clone.innerHTML=clone.innerHTML.replace(/<strong>([^<]{1,30}):<\/strong>\s*/g,
            (_,lbl)=>`<span class="lbl-pill">${lbl}</span> `);
          out.appendChild(clone);
        });
      }
      i=j;continue;
    }
    appendNode(node);i++;
  }
  return out.innerHTML;
}

function resolveModelColor(){
  if(S.model==='00')  return C.blue;
  if(S.model==='000') return C.red;
  if(S.model==='V')   return C.violet;
  return C.grey;
}
function resolveInputColor(){
  if(S.model==='00')  return C.blue;
  if(S.model==='000') return C.red;
  if(S.model==='V')   return C.violet;
  if(modeOn('code'))  return C.green;
  if(modeOn('web'))   return C.blue;
  if(modeOn('image')) return C.yellow;
  return C.grey;
}
function applyGlobalTheme(c){
  const root=document.documentElement;
  root.style.setProperty('--accent', c.accent);
  root.style.setProperty('--accent-dim', c.accentDim);
  root.style.setProperty('--accent-subtle', c.accentSubtle);
  root.style.setProperty('--accent-border', c.accentBorder);
  document.body.classList.toggle('themed', !!c.themed);
  document.getElementById('topbar')?.classList.toggle('themed', !!c.themed);
}
function applyColors(){
  applyGlobalTheme(resolveModelColor());
  const c=resolveInputColor();
  const mb=document.getElementById('model-btn');
  if(mb){mb.style.borderColor=c.border;mb.style.color=c.text;mb.style.boxShadow=c.glow;}
  const box=document.getElementById('input-box');
  if(box){box.style.borderColor=c.border;box.style.boxShadow=c.glow;}
  const sb=document.getElementById('send-btn');
  if(sb){
    if(!sb.disabled){sb.style.background=c.send;sb.style.color=c.sendTxt;sb.style.boxShadow=c.glow;}
    else{sb.style.background=c.sendDis;sb.style.color=c.sendDisTxt;sb.style.boxShadow='none';}
  }
  const ab=document.getElementById('attach-btn');
  if(ab){ab.style.background='#1a1a1a';ab.style.color='#888';}

  applyModeButtons(c);
}

const LEAK_LINE_RE=[/^\s*\[[A-Z][^\]]{2,120}\]\s*$/,/---\s*WEB SEARCH RESULTS\s*---/i,/---\s*END SEARCH RESULTS\s*---/i,/\bDIRECT\s*ANSWER\s*:/i,/\[CODE MODE\b/i,/\[Current date and time\]/i,/\[Reasoning context above/i,/\[Continue from where/i,/\[Search complete/i,/<context>|<\/context>/i,/\bYou are (?:0|00|000)\b/,/\bsystem prompt\b/i,/\b(?:my|the) (?:instructions?|rules|role|configuration|behavior list)\b/i];
function sanitizeThinkText(t){if(!t)return t;return t.split('\n').map(l=>{for(const r of LEAK_LINE_RE)if(r.test(l))return'…';return l;}).join('\n');}

const UNCERTAINTY_HARD=[/\b(don'?t|do not|doesn'?t|does not)\s+have\s+(access|real.?time|live|current|up.?to.?date)\b/i,/\b(can'?t|cannot|could not|couldn'?t)\s+(access|find|retrieve|fetch|get)\s+(real.?time|live|current|up.?to.?date|today'?s?|latest)\b/i,/\bmy\s+(knowledge|training|data)\s+(cut.?off|ends?|stops?|is\s+limited\s+to|is\s+from)\b/i,/\b(as\s+of\s+my\s+(last|knowledge)\s+update|my\s+knowledge\s+(only\s+goes?|extends?)\s+to)\b/i,/\b(this\s+(information\s+)?(may|might|could)\s+(be\s+)?(outdated|have\s+changed|no\s+longer\s+be\s+accurate))\b/i,/\b(i\s+(don'?t|do\s+not)\s+know\s+the\s+(current|latest|today'?s?|real.?time|live))\b/i,/\b(for\s+the\s+most\s+(up.?to.?date|current|accurate|recent)\s+(information|data|details),?\s+(please\s+)?(check|visit|refer|look))\b/i,/\b(i\s+(genuinely\s+)?(don'?t|do\s+not)\s+know|i\s+have\s+no\s+(idea|information|data)\s+(about|on|regarding))\b/i,/\b(unable\s+to\s+(provide|give|access)\s+(current|live|real.?time|today'?s?))\b/i,/\b(you'?d?\s+(need|should|would\s+need)\s+to\s+(check|verify|look\s+up)\s+(the\s+)?(current|latest|live|real.?time))\b/i,
/\b(not\s+sure\s+(if|whether|about)\s+(this\s+)?(syntax|api|method|function|library|package|version))\b/i,/\b(you\s+(may|might|should)\s+(want\s+to\s+)?(check|verify|confirm)\s+(the\s+)?(docs?|documentation|api|syntax))\b/i,/\b(this\s+(may|might)\s+(have\s+changed|be\s+different|vary)\s+(in|across|between|with)\s+(newer|older|different|recent)\s+versions?)\b/i,/\b(i'?m\s+not\s+(100%\s+)?(certain|sure|confident)\s+(about\s+(the\s+)?)?(exact|precise|correct)\s+(syntax|api|usage|name))\b/i];
const UNCERTAINTY_NEVER=[/\b(i\s+know|i\s+am\s+sure|i\s+am\s+certain|the\s+answer\s+is|this\s+is\s+definitely)\b/i,/\b(here'?s?\s+(the\s+)?(code|solution|answer|implementation|example|fix))\b/i,/\b(let\s+me\s+(explain|show|walk\s+you|help\s+you|write|create|build))\b/i,/```/];
function detectUncertainty(text){if(!text||text.length<60)return false;const w=text.slice(-800);if(UNCERTAINTY_NEVER.some(r=>r.test(w)))return false;return UNCERTAINTY_HARD.some(r=>r.test(w));}

const USER_SEARCH_EXPLICIT=[/\b(weather|forecast)\s+(in|for|today|tomorrow|right\s+now)\b/i,/\b(live|real.?time)\s+(score|result|price|rate|stock|exchange|update)\b/i,/\b(breaking\s+news|latest\s+news|recent\s+news|today'?s?\s+news)\b/i,/\bwhat'?s?\s+(the\s+)?(current|today'?s?|live|right\s+now)\s+(price|weather|score|news|status)\b/i,/\b(price\s+of|how\s+much\s+is)\s+(bitcoin|btc|eth|ethereum)\s+(now|today|currently|right\s+now)\b/i,/\b(who\s+won|final\s+score|match\s+result)\s+.{0,30}(today|tonight|yesterday|this\s+week)\b/i,/\bcurrent\s+(time|date)\s+in\b/i];
const USER_SEARCH_SKIP=[
  /^(hi|hello|hey|thanks?|ok|bye|yes|no|sure|lol|hm+|um+)[\s!.?]*$/i,
  /\b(how\s+(do|to)|what\s+is|explain|why|define|difference\s+between|compare|what\s+are)\b/i,
  /\b(write|create|make|generate|help\s+me|give\s+me|list|show|build|code|design)\b/i,

  /\b(fix|debug|refactor|review|improve|optimize|explain\s+this|what'?s?\s+wrong)\b/i,

function queryNeedsSearch(text){
  if(modeOn('image'))return false;
  if(!text)return false;
  if(modeOn('web'))return true;
  if(!S.settings.webSearchAuto)return false;
  const t=text.trim();
  if(t.length<8)return false;
  if(USER_SEARCH_SKIP.some(r=>r.test(t)))return false;
  if(modeOn('code')){
    const codeSearchTriggers=[
      /\b(latest|current|newest|stable)\s+(version|release|api|docs?)\b/i,
      /\b(how\s+to|best\s+way\s+to)\s+(install|setup|configure|deploy)\b/i,
      /\b(does|is|are|has)\s+.{0,40}\s+(supported?|available|work|exist)\b/i,
      /\b(npm|yarn|pip|cargo|gem)\s+(install|add|update)\b/i,
      /\b(changelog|breaking\s+change|migration|upgrade)\b/i,
    ];
    if(codeSearchTriggers.some(r=>r.test(t)))return true;
  }
  return USER_SEARCH_EXPLICIT.some(r=>r.test(t));
}

let speedState = { startTime: 0, timer: null };

function startSpeedTimer(){
  stopSpeedTimer();
  speedState.startTime = Date.now();
  updateSpeedDisplay();
  speedState.timer = setInterval(updateSpeedDisplay, 100);
}
function stopSpeedTimer(){
  if(speedState.timer) { clearInterval(speedState.timer); speedState.timer = null; }
}
function updateSpeedDisplay(){
  const el = document.getElementById('speed-timer');
  if(!el) return;
  const elapsed = Date.now() - speedState.startTime;
  const secs = elapsed / 1000;
  el.textContent = formatDuration(secs);
}
function formatDuration(secs){
  if(secs < 60) return secs.toFixed(2) + 's';
  const minutes = Math.floor(secs / 60);
  const remainder = secs % 60;
  return `${minutes}m ${remainder.toFixed(2)}s`;
}

/* ══════════════════════════════════════
   FILE ATTACHMENT SYSTEM
══════════════════════════════════════ */
const FILE_MAX_BYTES=20*1024*1024;
const FILE_ACCEPT=['.txt','.md','.log','.json','.xml','.yaml','.yml','.html','.css','.js','.py','.java','.c','.cpp','.cs','.csv','.tsv','.rtf','.pdf','.docx','.xlsx','.zip','.png','.jpg','.jpeg','.webp','.svg'];
const IMAGE_EXTS=['.png','.jpg','.jpeg','.gif','webp'];
const SVG_CONVERT_EXTS=['.png','.jpg','.jpeg','.gif','.webp']; // images that get SVG conversion
let _attachedFiles=[]; // [{name, ext, text, isImage, dataUrl, mimeType, svgData?}]

// Convert a raster image dataUrl to an SVG wrapper (embeds as base64 <image> tag)
async function _convertImageToSVG(dataUrl, mimeType, width, height){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      const w=img.naturalWidth||width||512;
      const h=img.naturalHeight||height||512;
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><image href="${dataUrl}" width="${w}" height="${h}"/></svg>`;
      resolve(svg);
    };
    img.onerror=()=>resolve(null);
    img.src=dataUrl;
  });
}

function _fileExtOf(name){return('.'+name.split('.').pop().toLowerCase());}
function _fmtLabel(ext){return ext.replace('.','').toUpperCase();}

const _chipSVG=`<svg width="9" height="9" viewBox="0 0 6 7" fill="currentColor" shape-rendering="crispEdges"><rect x="1" y="0" width="3" height="1"/><rect x="0" y="1" width="1" height="5"/><rect x="5" y="2" width="1" height="4"/><rect x="0" y="6" width="6" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="1" y="4" width="3" height="1"/></svg>`;

function showFileErr(msg){
  const pr=document.getElementById('file-parse-progress');if(!pr)return;
  pr.textContent='⚠ '+msg;pr.style.color='#e06060';pr.classList.add('show');
  setTimeout(()=>{pr.classList.remove('show');pr.style.color='';},4000);
}

function onFileSelected(e){
  const files=Array.from(e.target.files||[]);e.target.value='';
  if(!files.length)return;
  const valid=[];
  for(const f of files){
    const ext=_fileExtOf(f.name);
    if(!FILE_ACCEPT.includes(ext)){showFileErr('"'+f.name+'" — unsupported type. Allowed: '+FILE_ACCEPT.join(', '));continue;}
    if(f.size>FILE_MAX_BYTES){showFileErr('"'+f.name+'" is too large (max 20MB).');continue;}
    if(_attachedFiles.some(a=>a.name===f.name))continue;
    valid.push(f);
  }
  if(valid.length)_parseFiles(valid);
}

async function _parseFiles(files){
  const pr=document.getElementById('file-parse-progress');
  for(let i=0;i<files.length;i++){
    const file=files[i];
    if(pr){pr.textContent='Reading '+file.name+(files.length>1?' ('+(i+1)+'/'+files.length+')':'')+'…';pr.style.color='';pr.classList.add('show');}
    try{
      const ext=_fileExtOf(file.name);let text='';
      if(IMAGE_EXTS.includes(ext)){
        // Vision: convert image to base64 data URL
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
        const mimeType=file.type||'image/jpeg';
        let svgData=null;
        if(SVG_CONVERT_EXTS.includes(ext)){
          svgData=await _convertImageToSVG(b64,mimeType,null,null);
        }
        _attachedFiles.push({name:file.name,ext,text:'',isImage:true,dataUrl:b64,mimeType,svgData});
      } else {
      if(['.txt','.md','.log','.xml','.yaml','.yml','.html','.css','.js','.py','.java','.c','.cpp','.cs','.csv','.tsv'].includes(ext)){text=await file.text();if(!text.trim())throw new Error('"'+file.name+'" is empty.');}
      else if(ext==='.rtf'){text=await file.text();text=text.replace(/\{\\[a-z]+\d*\s?|\}|\\[a-z]+\d*\s?/g,' ').replace(/\s+/g,' ').trim();if(!text.trim())throw new Error('"'+file.name+'" is empty.');}
      else if(ext==='.json'){text=await file.text();if(!text.trim())throw new Error('"'+file.name+'" is empty.');try{JSON.parse(text);}catch(_){throw new Error('"'+file.name+'" is not valid JSON.');}}
      else if(ext==='.pdf'){text=await _parsePDF(file,pr);}
      else if(ext==='.docx'){text=await _parseDOCX(file);}
      else if(ext==='.xlsx'){text=await _parseXLSX(file);}
      else if(ext==='.zip'){text=await _parseZIP(file);}

      if(!text||!text.trim())throw new Error('Could not extract text from "'+file.name+'".');
      _attachedFiles.push({name:file.name,ext,text:text.trim(),isImage:false});
      }
    }catch(err){showFileErr(err.message||'Failed to read "'+file.name+'".');}
  }
  if(pr){pr.classList.remove('show');pr.textContent='';}
  _renderTray();
}

async function _parsePDF(file,pr){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=()=>rej(new Error('Failed to load PDF parser.'));document.head.appendChild(s);});
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=pdf.numPages;i++){
    if(pr)pr.textContent='Reading '+file.name+'… page '+i+'/'+pdf.numPages;
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const t=content.items.map(it=>it.str).join(' ');
    if(t.trim())out+=t+'\n';
  }
  if(!out.trim())throw new Error('"'+file.name+'" has no extractable text (scanned/image PDF).');
  return out;
}

async function _parseDOCX(file){
  if(!window.mammoth){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=res;s.onerror=()=>rej(new Error('Failed to load DOCX parser.'));document.head.appendChild(s);});
  }
  const buf=await file.arrayBuffer();
  const result=await window.mammoth.extractRawText({arrayBuffer:buf});
  if(!result.value||!result.value.trim())throw new Error('"'+file.name+'" is empty or unreadable.');
  return result.value;
}

async function _parseZIP(file){
  if(!window.JSZip){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=res;s.onerror=()=>rej(new Error('Failed to load ZIP parser.'));document.head.appendChild(s);});
  }
  const buf=await file.arrayBuffer();
  const zip=await window.JSZip.loadAsync(buf);
  const TEXT_EXTS=['.txt','.md','.log','.json','.xml','.yaml','.yml','.html','.css','.js','.py','.java','.c','.cpp','.cs','.csv','.tsv','.rtf'];
  let out='';
  const entries=Object.values(zip.files).filter(f=>!f.dir);
  if(!entries.length)throw new Error('"'+file.name+'" is empty.');
  for(const entry of entries){
    const ext='.'+entry.name.split('.').pop().toLowerCase();
    if(!TEXT_EXTS.includes(ext))continue;
    const text=await entry.async('string');
    if(text.trim())out+=`[File: ${entry.name}]\n${text.trim()}\n\n`;
  }
  if(!out.trim())throw new Error('"'+file.name+'" has no readable text files inside.');
  return out.trim();
}

async function _parseXLSX(file){
  if(!window.XLSX){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Failed to load XLSX parser.'));document.head.appendChild(s);});
  }
  const buf=await file.arrayBuffer();
  const wb=window.XLSX.read(buf,{type:'array'});
  let out='';
  wb.SheetNames.forEach(name=>{
    const ws=wb.Sheets[name];
    const csv=window.XLSX.utils.sheet_to_csv(ws);
    if(csv.trim())out+=`[Sheet: ${name}]\n${csv}\n\n`;
  });
  if(!out.trim())throw new Error('"'+file.name+'" has no readable content.');
  return out.trim();
}

function _renderTray(){
  const tray=document.getElementById('file-tray');
  const ab=document.getElementById('attach-btn');
  if(!tray)return;
  if(!_attachedFiles.length){
    tray.innerHTML='';tray.classList.remove('show');
    if(ab)ab.classList.remove('has-file');
    return;
  }
  tray.innerHTML=_attachedFiles.map((f,i)=>`<div class="file-chip">${_chipSVG}<span>${esc(_fmtLabel(f.ext))}</span><button class="file-chip-remove" onclick="_removeFile(${i})" title="Remove"><svg width="8" height="8" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg></button></div>`).join('');
  tray.classList.add('show');
  if(ab)ab.classList.add('has-file');
  const sb=document.getElementById('send-btn');
  if(sb){sb.disabled=false;applyColors();}
}

function _removeFile(idx){
  _attachedFiles.splice(idx,1);
  _renderTray();
  if(!_attachedFiles.length){
    const inp=document.getElementById('user-input');
    const sb=document.getElementById('send-btn');
    if(sb&&inp){sb.disabled=!inp.value.trim();applyColors();}
  }
}

function _clearAllFiles(){
  _attachedFiles=[];
  const tray=document.getElementById('file-tray');
  const ab=document.getElementById('attach-btn');
  if(tray){tray.innerHTML='';tray.classList.remove('show');}
  if(ab)ab.classList.remove('has-file');
}

async function sendMsg(){
  const inp=document.getElementById('user-input');if(!inp)return;
  const raw=inp.value.trim();
  if(!raw&&!_attachedFiles.length)return;

  // ═══ SLASH LINKS (checked first, even if busy) ═══
  if(raw.startsWith('/')){
    const parts=raw.slice(1).trim().split(/\s+/);
    const cmd=parts[0].toLowerCase();
    if(SLASH_LINKS[cmd]){window.location.href=SLASH_LINKS[cmd];}
    inp.value='';autoGrow(inp);
    const sb=document.getElementById('send-btn');if(sb){sb.disabled=true;applyColors();}
    return;
  }

  if(S.busy)return;
  S.busy=true;

  // Capture and clear files before any async work
  const files=[..._attachedFiles];
  _clearAllFiles();

  // Build the model payload: support both text files and vision images
  let modelContent=raw;
  let visionPayload=null; // multipart array for vision messages
  const imageFiles=files.filter(f=>f.isImage);
  const textFiles=files.filter(f=>!f.isImage);

  if(imageFiles.length){
    // Build OpenAI-compatible vision message with image_url parts
    const parts=[];
    const textCtx=textFiles.length?textFiles.map(f=>`[Attached File: ${f.name}]\n---\n${f.text}\n---`).join('\n\n'):'';
    const userText=(raw?(textCtx?raw+'\n\n'+textCtx:raw):(textCtx||'Analyze this image.'));
    parts.push({type:'text',text:userText});
    for(const img of imageFiles){
      parts.push({type:'image_url',image_url:{url:img.dataUrl}});
    }
    visionPayload=parts;
    modelContent=userText; // plain text for history display
  } else if(textFiles.length){
    const ctx=textFiles.map(f=>`[Attached File: ${f.name}]\n---\n${f.text}\n---`).join('\n\n');
    modelContent=raw?raw+'\n\n'+ctx:ctx;
  }

  // Store display message: text + file ext labels in msg.files array
  // Also store the full modelContent (with file text injected) for API use
  const displayMsg={
    role:'user',
    content:raw,
    modelContent:modelContent,           // full text incl. parsed files
    visionPayload:visionPayload||null,   // vision parts if any images
    files:files.map(f=>_fmtLabel(f.ext)),
    ts:Date.now()
  };

  const c=ensureConvo();
  c.msgs.push(displayMsg);
  if(c.msgs.length===1){c.title=mkTitle(raw||files.map(f=>f.name).join(', '));setTitle(c.title);}
  c.ts=Date.now();inp.value='';autoGrow(inp);

  const sb=document.getElementById('send-btn');if(sb){sb.disabled=true;applyColors();}
  renderMsgs();renderSB();
  if(S.settings.speedTimer){startSpeedTimer();}
  if(modeOn('image')){await genImage(c,raw||'');S.busy=false;if(sb){sb.disabled=!inp.value.trim();applyColors();}return;}

  let userSearchData=null;const userWantsSearch=queryNeedsSearch(modelContent);
  if(userWantsSearch){showUserSearchInd();userSearchData=await doSearch(modelContent);hideUserSearchInd();}
  const aiId='ai'+uid();
  const isCodeMode=modeOn('code');
  appendPending(aiId,isCodeMode);

  await generate(c,aiId,userSearchData,modelContent,userWantsSearch,false,isCodeMode);
}
function showUserSearchInd(){const ca=document.getElementById('chat-area');if(!ca||document.getElementById('srch-ind'))return;const el=document.createElement('div');el.id='srch-ind';el.style.cssText='padding:4px 14px;margin:4px 0';el.innerHTML=`<div class="activity-wrap" data-state="searching" style="padding:6px 0"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">Searching</div><div class="activity-sub">Finding sources</div></div></div>`;ca.appendChild(el);scrollBot();}

function appendPending(id,isCodeMode){
  const ca=document.getElementById('chat-area');if(!ca)return;
  const m=MODELS[S.model]||MODELS['0'];
  const row=document.createElement('div');
  row.className='msg-row ai';
  row.id=id;
  if(isCodeMode)row.dataset.codemode='true';

  if(m.hasThink){
    row.innerHTML=`<div class="msg-in"><div class="msg-content"><img class="ai-av" src="icon.webp" alt=""/><div class="ai-body">
      <div class="ai-think streaming" id="${id}think" onclick="event.stopPropagation()"><div class="ai-think-hdr" onclick="event.stopPropagation();this.closest('.ai-think').classList.toggle('open')">
        <svg class="ai-think-chev" width="10" height="10" viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges"><rect x="1" y="1" width="1" height="3"/><rect x="2" y="0" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="1" width="1" height="3"/><rect x="4" y="2" width="1" height="1"/></svg>
        <span class="ai-think-lbl" id="${id}thlbl">Thinking</span></div>
        <div class="ai-think-body"><div class="ai-think-content" id="${id}thcont"></div></div></div>
      <div class="answer-waiting" id="${id}aw"><div class="answer-waiting-dots"><span></span><span></span><span></span></div><span class="answer-waiting-lbl">Answer on the way…</span></div>
      <div class="ai-txt" id="${id}txt" style="display:none"></div>
    </div></div></div></div>`;
  }else{

    </div></div></div></div>`;
  }

}

async function* streamRaw(msgs,extraCtx,modelKey,maxTok,abortSignal,contMode,useSearch){
  const mDef=MODELS[modelKey]||MODELS['0'];let res;
  try{res=await fetch('/api/chat.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,context:extraCtx,temperature:mDef.temp,maxTokens:maxTok||8000,model:modelKey,contMode:!!contMode,useSearch:!!useSearch}),signal:abortSignal});}
  catch(e){if(e.name!=='AbortError')throw e;return;}
  if(!res.ok)throw new Error('HTTP '+res.status);
  const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
  let pendingReplace=false;let replaceBuf='';
  try{while(true){const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()??'';
    for(const line of lines){
      const l=line.trim();if(!l.startsWith('data:'))continue;
      const raw=l.slice(5).trim();if(raw==='[DONE]'){
        if(pendingReplace&&replaceBuf.trim())yield{type:'verify_replace',text:replaceBuf};
        return;
      }
      try{const d=JSON.parse(raw);const choice=d.choices?.[0];if(!choice)continue;
        if(choice.finish_reason)yield{type:'finish',reason:choice.finish_reason};
        const text=choice.delta?.content;
        if(typeof text==='string'&&text.length){
          if(pendingReplace){
            replaceBuf+=text;
          }else{
            const sentinelIdx=text.indexOf('\x00VERIFY_REPLACE\x00');
            if(sentinelIdx!==-1){
              pendingReplace=true;
              replaceBuf=text.slice(sentinelIdx+'\x00VERIFY_REPLACE\x00'.length);
            }else{
              yield text;
            }
          }
        }
      }catch(_){}
    }
  }}catch(e){if(e.name!=='AbortError')throw e;}
  if(pendingReplace&&replaceBuf.trim())yield{type:'verify_replace',text:replaceBuf};
}
const OPEN_TAGS=['<think>','<thinking>','<|begin_of_thought|>'];
const CLOSE_TAGS=['</think>','</thinking>','<|end_of_thought|>'];
const MAX_TAG_LEN=22;
function findFirst(buf,tags){let best=-1,bestTag=null;for(const t of tags){const i=buf.indexOf(t);if(i!==-1&&(best===-1||i<best)){best=i;bestTag=t;}}return{idx:best,tag:bestTag};}

async function* streamParsed(msgs,extraCtx,modelKey,maxTok,abortSignal,isThinkModel,contMode,useSearch){
  if(isThinkModel===undefined)isThinkModel=true;
  let inThink=false,thinkSeen=false,buffer='';
  for await(const delta of streamRaw(msgs,extraCtx,modelKey,maxTok,abortSignal,contMode,useSearch)){
    if(delta&&typeof delta==='object'){yield delta;continue;}
    if(!isThinkModel){
      if(delta.length)yield{type:'answer',text:delta};
      continue;
    }
    buffer+=delta;
    while(buffer.length>0){
      if(inThink){
        const{idx,tag}=findFirst(buffer,CLOSE_TAGS);
        if(idx!==-1){
          if(idx>0)yield{type:'think',text:buffer.substring(0,idx)};
          inThink=false;buffer=buffer.substring(idx+tag.length);
        }else{
          const safe=Math.max(0,buffer.length-MAX_TAG_LEN);
          if(safe>0){yield{type:'think',text:buffer.substring(0,safe)};buffer=buffer.substring(safe);}
          break;
        }
      }else{
        const{idx,tag}=findFirst(buffer,OPEN_TAGS);
        if(idx!==-1){
          if(idx>0)yield{type:'answer',text:buffer.substring(0,idx)};
          if(!thinkSeen){
            inThink=true;thinkSeen=true;buffer=buffer.substring(idx+tag.length);
          }else{
            const rest=buffer.substring(idx+tag.length);
            const{idx:ci,tag:ct}=findFirst(rest,CLOSE_TAGS);
            buffer=ci!==-1?rest.substring(ci+ct.length):'';
            if(ci===-1)break;
          }
        }else{
          const safe=Math.max(0,buffer.length-MAX_TAG_LEN);
          if(safe>0){yield{type:'answer',text:buffer.substring(0,safe)};buffer=buffer.substring(safe);}
          break;
        }
      }
    }
  }
  if(buffer.length>0){
    yield inThink?{type:'think',text:buffer}:{type:'answer',text:buffer};
  }
}

async function generate(convo,aiId,userSearchData,userQuery,userWantsSearch,contMode,isCodeMode){
  contMode=contMode||false;
  if(isCodeMode===undefined)isCodeMode=modeOn('code');
  S.busy=true;
  const txtEl=document.getElementById(aiId+'txt');
  const thinkEl=document.getElementById(aiId+'think');
  const thCont=document.getElementById(aiId+'thcont');
  const thLbl=document.getElementById(aiId+'thlbl');
  const awEl=document.getElementById(aiId+'aw');
  const modelKey=S.model;const mDef=MODELS[modelKey]||MODELS['0'];const useThink=mDef.hasThink;
  // Build API messages: use plain text for history, only inject visionPayload for the last user turn
  // IMPORTANT: baseMsgs must use only the stored content (not modelContent which may have file ctx injected)
  // The extraCtx (date, search, code mode) is passed separately and injected server-side
  const baseMsgs=convo.msgs.map((m,i)=>{
    if(m.role==='user'){
      // Prefer vision payload if this user turn has images
      if(m.visionPayload)return{role:'user',content:m.visionPayload};
      // Otherwise use modelContent (raw text + parsed file contents) if available
      if(m.modelContent)return{role:'user',content:m.modelContent};
      return{role:'user',content:m.content||''};
    }
    return{role:m.role,content:m.content||''};
  });
  let thinkText='',answerText='',tStart=Date.now(),thinkDurStr=null,answerPhase=false;
  let wasTruncated=false;
  let internalSearchFired=false,internalSearchData=null;
  let extraCtx=dtCtx();

  if(userSearchData&&(userSearchData.results?.length||userSearchData.answer))extraCtx+=buildSearchCtx(userSearchData);
  if(contMode)extraCtx+='\n\nThe previous response was cut off mid-generation. Resume seamlessly from exactly where it stopped. Do NOT repeat any text already written. Do NOT start with a preamble or transition sentence.';
  // Never fire internal smart search on continuation — context is already established

    if(answerPhase)return;answerPhase=true;
    thinkDurStr=((Date.now()-tStart)/1000).toFixed(1);

    if(thLbl)thLbl.textContent='Thought for '+thinkDurStr+'s';
    if(awEl)awEl.remove();
    if(txtEl){
      txtEl.style.display='';
      const aState=isCodeMode?'coding':'writing';
      const aLabel=isCodeMode?'Writing Code':'Writing';
      txtEl.innerHTML='<div class="activity-wrap" data-state="'+aState+'"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">'+aLabel+'</div></div></div>';
    }
    if(S.settings.autoscroll)scrollBot();
  };

  const _renderAnswerNow=()=>{
    if(!txtEl)return;
    const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
    txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';
    attachCodeBtns();
    if(S.settings.autoscroll)scrollBot();
  };
  const renderAnswer=throttle(_renderAnswerNow,150);

  const renderThink=(text)=>{
    thinkText+=text;
    if(thCont){
      if(!thCont._tn){thCont._tn=document.createTextNode('');thCont.appendChild(thCont._tn);}
      thCont._tn.nodeValue=sanitizeThinkText(thinkText);
      if(S.settings.autoscroll)scrollBot();
    }
  };

  try{
    if(useThink){
      tStart=Date.now();
      let runWithSmartSearch=false,firstPass=true;
      while(true){
        runWithSmartSearch=false;
        for await(const chunk of streamParsed(baseMsgs,extraCtx,modelKey,8000,S.abort.signal,true,false,userWantsSearch)){
          if(S.abort?.signal?.aborted&&!internalSearchFired)break;
          if(chunk&&typeof chunk==='object'&&chunk.type==='finish'){if(chunk.reason==='length')wasTruncated=true;continue;}
          if(chunk.type==='think'){
            if(answerPhase){
              answerText+=chunk.text;renderAnswer();
            }else{
              renderThink(chunk.text);
              if(firstPass&&!internalSearchFired&&allowSmartSearch&&S.settings.webSearchAuto&&!userSearchData&&thinkText.length>80&&detectUncertainty(thinkText)){
                internalSearchFired=true;runWithSmartSearch=true;if(S.abort)S.abort.abort();break;
              }
            }
          }else if(chunk.type==='answer'){
            enterAnswerPhase();
            answerText+=chunk.text;renderAnswer();
          }
        }
        if(runWithSmartSearch){
          let pill=null;
          if(thCont){pill=document.createElement('div');pill.className='think-srch-pill';pill.innerHTML='Searching for more info<div class="think-srch-dot"></div><div class="think-srch-dot"></div><div class="think-srch-dot"></div>';thCont.appendChild(pill);if(S.settings.autoscroll)scrollBot();}
          const q=userQuery||baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content||'';
          internalSearchData=await doSearch(q);
          if(pill&&thCont){const done=document.createElement('div');done.className='think-srch-done';done.textContent='Found info — continuing';pill.replaceWith(done);}
          extraCtx=extraCtx+(internalSearchData?buildSearchCtx(internalSearchData):'')+'\n\nUse the information above and reply with the final answer only.';
          S.abort=new AbortController();userSearchData=internalSearchData;if(internalSearchData)userWantsSearch=true;firstPass=false;
          if(thCont&&thCont._tn){thCont._tn.nodeValue='';thCont._tn=null;}thinkText='';
          continue;
        }else{break;}
      }

      if(!answerPhase){
        const promoted=promoteThinkTail(thinkText);
        if(promoted){
          answerText=promoted;enterAnswerPhase();
        }else{
          thinkDurStr=((Date.now()-tStart)/1000).toFixed(1);
          if(thinkEl)thinkEl.classList.remove('streaming');
          if(thLbl)thLbl.textContent='Thought for '+thinkDurStr+'s';
          if(awEl)awEl.remove();
          if(txtEl){txtEl.style.display='';txtEl.innerHTML='';}
        }
      }

      if(txtEl){
        const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
        txtEl.style.display='';
        txtEl.innerHTML=answerText?renderMd(answerText):renderMd('_(No answer generated — try again)_');
      }

    }else{
      const _renderNonThink=throttle(()=>{
        if(!txtEl)return;
        const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
        txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';
        attachCodeBtns();
        if(S.settings.autoscroll)scrollBot();
      },150);
      for await(const chunk of streamParsed(baseMsgs,extraCtx,modelKey,8000,S.abort.signal,false,false,userWantsSearch)){
        if(S.abort?.signal?.aborted)break;
        if(chunk&&chunk.type==='verify_replace'){
  // Strip any verification preamble the model may have leaked
  let vText=chunk.text;
  vText=vText.replace(/^[\s\S]{0,300}?(?:here(?:'s| is)(?: the)?(?: (?:corrected|improved|revised|updated|fixed))? (?:response|answer|version)[:\s]*|i(?:'ve| have) (?:reviewed|checked|corrected|improved|fixed|updated)[\s\S]{0,100}?:\s*)/i,'').trim();
  if(!vText)continue;
  answerText=vText;
  if(txtEl){
    txtEl.style.transition='opacity .2s';
    txtEl.style.opacity='0';
    setTimeout(()=>{
      txtEl.innerHTML=renderMd(answerText);
      attachCodeBtns();
      txtEl.style.opacity='1';
    },200);
  }
  continue;
}
        const txt=(chunk&&chunk.text)||'';if(!txt)continue;
        answerText+=txt;
        if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();_renderNonThink();}
      }
      if(!wasTruncated&&answerText&&!userSearchData&&allowSmartSearch&&S.settings.webSearchAuto&&!modeOn('image')&&detectUncertainty(answerText)){
        showUserSearchInd();
        const q=userQuery||baseMsgs.filter(m=>m.role==='user').slice(-1)[0]?.content||'';
        const sd=await doSearch(q);hideUserSearchInd();
        if(sd){
          userSearchData=sd;userWantsSearch=true;
          const ctx2=extraCtx+buildSearchCtx(sd);
          if(txtEl)txtEl.innerHTML='<div class="activity-wrap" data-state="writing"><div class="activity-orb"><div class="activity-orb-ring"></div><div class="activity-orb-dot"></div></div><div class="activity-right"><div class="activity-label anim-dots">Re-answering</div></div></div>';
          answerText='';S.abort=new AbortController();
          const _renderReAnswer=throttle(()=>{
            if(!txtEl)return;
            const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();
            txtEl.innerHTML=DOMPurify.sanitize(marked.parse(answerText))+'<span class="stream-cur"></span>';
            attachCodeBtns();if(S.settings.autoscroll)scrollBot();
          },150);
          for await(const chunk of streamParsed(baseMsgs,ctx2,modelKey,8000,S.abort.signal,false,false,true)){
            if(S.abort?.signal?.aborted)break;
            const txt=(chunk&&chunk.text)||'';if(!txt)continue;
            answerText+=txt;
            if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();_renderReAnswer();}
          }
        }
      }
      if(txtEl){const aw=txtEl.querySelector('.activity-wrap');if(aw)aw.remove();txtEl.innerHTML=renderMd(answerText||'');}
    }
  }catch(err){
    if(err.name!=='AbortError'){
      document.getElementById(aiId)?.remove();
      setStopMode(false);
      showErr(err.message||null);S.busy=false;S.abort=null;
      const inp=document.getElementById('user-input');const sb=document.getElementById('send-btn');
      if(sb){sb.disabled=!inp||!inp.value.trim();applyColors();}
      stopSpeedTimer();
      return;
    }else{
      // Aborted by user: fall through to finalize so UI state resets cleanly
      setStopMode(false);
    }
  }

  setStopMode(false);
  const effectiveSources=userWantsSearch?(userSearchData?.results||[]):[];

  const savedAnswer=answerText.trim();
  const savedThinking=sanitizeThinkText(thinkText).trim()||null;

  if(!savedAnswer&&!thinkText.trim()){
    convo.msgs.push({role:'assistant',content:'_(No response — tap Retry)_',ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:isCodeMode,thinking:null,thinkDuration:null,truncated:false,emptyRetry:true,modelKey});
  }else if(!savedAnswer&&savedThinking){
    convo.msgs.push({role:'assistant',content:'',ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:isCodeMode,thinking:savedThinking,thinkDuration:thinkDurStr,truncated:false,modelKey});
  }else{
    convo.msgs.push({role:'assistant',content:savedAnswer,ts:Date.now(),userSearched:!!userWantsSearch,sources:effectiveSources,codeMode:isCodeMode,thinking:savedThinking,thinkDuration:thinkDurStr,truncated:wasTruncated,modelKey});

        const existing=aiBody.querySelector('.sources-wrap');if(existing)existing.remove();

        if(items){const sw=document.createElement('div');sw.className='sources-wrap';sw.innerHTML=`<button class="sources-toggle" onclick="event.stopPropagation();toggleSources(this)"><svg class="sources-chev" width="8" height="8" viewBox="0 0 4 4" fill="currentColor" shape-rendering="crispEdges"><rect x="0" y="1" width="1" height="2"/><rect x="1" y="0" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="1" width="1" height="2"/></svg>Sources (${savedMsg.sources.length})</button><div class="sources-list">${items}</div>`;aiBody.appendChild(sw);}
      }
      const actsEl=document.createElement('div');actsEl.className='msg-acts';actsEl.id='msg-'+msgIdx+'-acts';
      if(savedMsg&&savedMsg.truncated)actsEl.innerHTML=`<button class="ma-btn continue-btn" onclick="continueMsg(${msgIdx})">Continue</button>`;
      else if(savedMsg&&savedMsg.emptyRetry)actsEl.innerHTML=`<button class="ma-btn" onclick="retryEmpty(${msgIdx})" style="color:#e06060">Retry</button>`;
      aiBody.appendChild(actsEl);

      copyBtn.innerHTML=`<svg width="10" height="10" viewBox="0 0 6 6" fill="currentColor" shape-rendering="crispEdges"><rect x="2" y="0" width="4" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="3"/><rect x="2" y="4" width="3" height="1"/><rect x="0" y="1" width="4" height="1"/><rect x="0" y="2" width="1" height="3"/><rect x="3" y="2" width="1" height="1"/><rect x="0" y="5" width="4" height="1"/></svg>Copy`;
      aiBody.appendChild(copyBtn);
    }
    attachCodeBtns();
  }else if(pendingRow){
    const finalHtml=buildMsg(convo.msgs[msgIdx],msgIdx);
    const tmp=document.createElement('div');tmp.innerHTML=finalHtml;
    pendingRow.replaceWith(tmp.firstElementChild);

  }else{
    renderMsgs();
  }

  saveStore();S.busy=false;S.abort=null;
  const inp=document.getElementById('user-input');const sb=document.getElementById('send-btn');
  if(sb){sb.disabled=!inp||!inp.value.trim();applyColors();}scrollBot();
